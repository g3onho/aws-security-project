# 시나리오 카탈로그
#
# 정본: 루트 README.md 2-2 (SEC-01~SEC-10, README:171-193)
# 데모 전용 4종(DETECT-01 / NMS-01 / NMS-02 / IAM-01)은 `demo_only: true` 로 병기한다.
#   - 데모 데이터(static/js/data.js)가 실제로 쓰는 scenario 값이라 카탈로그에서 빠지면
#     `GET /api/events` 응답의 scenario 를 해석할 수 없다.
#   - 커버리지 보드(GET /api/scenarios)는 기본적으로 demo_only 를 제외하고 집계한다.
#
# remediation.wired
#   선언(SSM 문서 등록 + Lambda 환경변수)만이 아니라 **호출 분기가 실제로 있는지**.
#   ASR-HardenNginx 는 문서와 env 는 있으나 asr_trigger 에 분기가 없어 false (README:303,305).
#
# verify.type — 04-backend-design.md §3.4 의 7종
#   sg_ingress_count / iam_key_status / config_compliance / inspector_cve_count
#   / trivy_report_diff / cloudwatch_metric / http_headers
#   needs_send_command: true 인 항목은 대시보드 역할에 ssm:SendCommand 가 없어 현재 실행 불가
#   (compute/iam.tf:248-252 는 StartAutomationExecution 만 허용, soar/ssm.tf:93-97 은 Command 문서).

version: 1
updated: 2026-09-21

scenarios:

  SEC-01:
    title: Security Group 과다 공개(SSH 22 등)
    criterion: 0.0.0.0/0에 대한 TCP 22 인바운드 규칙 수
    unit: 개
    severity_hint: HIGH
    detection: [Config, GuardDuty]
    match:
      config_rules: [restricted-ssh]
      securityhub_generator_contains: ['EC2.13', 'restricted-ssh']
    remediation:
      planned_mode: AUTO        # 기획서 분류
      mode: AUTO                # 코드 기준 (decision == auto-executed)
      playbook: ASR-RevokeSecurityGroupIngress
      wired: true
      reversible: true          # 규칙 재추가로 원복
    verify:
      type: sg_ingress_count
      port: 22
      cidr: 0.0.0.0/0
      needs_send_command: false

  SEC-02:
    title: HTTP 평문·보안 헤더 미흡
    criterion: 필수 보안 헤더 누락 수 (동일 URL / 동일 헤더 집합)
    unit: 개
    severity_hint: MEDIUM
    detection: [Security Hub]
    match:
      securityhub_generator_contains: ['ELB.', 'CloudFront.']
    remediation:
      planned_mode: AUTO        # README 5-1 은 자동 3개로 설계
      mode: MANUAL              # 실제로는 호출 분기가 없어 수동 (README:303)
      playbook: ASR-HardenNginx
      wired: false
      reversible: true          # 원본 nginx.conf 백업 복원
      note: >-
        SSM Command 문서와 Lambda 환경변수 DOC_NGINX_HARDEN 은 존재하지만
        asr_trigger/handler.py 에 이 변수를 쓰는 분기가 없다(handler.py:175-178 로 낙하).
        커버리지 보드에 "미배선"으로 그대로 표시한다.
    verify:
      type: http_headers
      headers: [X-Content-Type-Options, X-Frame-Options, Strict-Transport-Security]
      needs_send_command: true

  SEC-03:
    title: DB 포트(3306) 외부 노출
    criterion: 0.0.0.0/0에 대한 TCP 3306 인바운드 규칙 수
    unit: 개
    severity_hint: CRITICAL
    detection: [Config, Security Hub]
    match:
      config_rules: [restricted-common-ports, vpc-sg-open-only-to-authorized-ports]
      securityhub_generator_contains: ['EC2.14', 'EC2.19']
    remediation:
      planned_mode: AUTO
      mode: AUTO
      playbook: ASR-RevokeSecurityGroupIngress
      wired: true
      reversible: true
      note: >-
        db-auto-sg 는 AutoRemediation=enabled 태그가 있어 자동 회수,
        db-manual-sg 는 태그가 없어 SNS 알림만 간다(대조군). 같은 EC2, 두 경로.
    verify:
      type: sg_ingress_count
      port: 3306
      cidr: 0.0.0.0/0
      needs_send_command: false

  SEC-04:
    title: 취약 컨테이너 이미지
    criterion: 동일 대상의 미해결 CVE 수 (전체 심각도)
    unit: 개
    severity_hint: HIGH
    detection: [Trivy, Inspector]
    match:
      sources: [Trivy, Inspector]
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: null
      wired: false
      reversible: true          # 이전 이미지 태그로 롤백
      note: 이미지 버전 고정·USER 지정 후 ECR push. 플레이북 없이 사람이 수행.
    verify:
      # Inspector2 는 EC2 뿐 아니라 **ECR 이미지도** 스캔한다. 대시보드 역할에
      # inspector2:ListFindings 가 이미 있으므로 ssm:SendCommand 없이 자동 재검증이 된다.
      type: inspector_cve_count
      needs_send_command: false
      # 심각도 필터를 두지 않는다 — criterion 이 '전체 심각도'다. 바꾸려면 둘을 같이 고친다.
      min_severity: null
      # 병행 경로. ssm:SendCommand 권한이 붙으면 Trivy 리포트 비교도 같이 쓴다.
      # 지금은 권한이 없어 담당자 증적 입력으로만 가능하다.
      alternates:
        - type: trivy_report_diff
          scan_document: SCAN-ContainerImage
          needs_send_command: true
          blocked_by: >-
            대시보드 실행 정책은 StartAutomationExecution 만 허용한다
            (compute/iam.tf dashboard_execute). 인프라 파트 요청 T6.

  SEC-05:
    title: 과도한 IAM 권한·Access Key 노출
    criterion: 노출된 Access Key 중 Active 상태 수
    unit: 개
    severity_hint: CRITICAL
    detection: [GuardDuty, Security Hub]
    match:
      guardduty_type_prefix:
        - 'UnauthorizedAccess:IAMUser'
        - 'CredentialAccess:IAMUser'
        - 'Discovery:IAMUser'
    remediation:
      planned_mode: AUTO
      mode: AUTO
      playbook: ASR-DisableExposedAccessKey
      wired: true
      reversible: true          # 재활성화 가능
      note: 키 비활성화는 자동, 최소권한 정책 재작성은 수동.
    verify:
      type: iam_key_status
      expected: Inactive
      needs_send_command: false
      blocked_by: >-
        대시보드 읽기 정책에 iam:ListAccessKeys / iam:GetAccessKeyLastUsed 가 없다
        (compute/iam.tf:179-196). SSM Automation 역할에는 있다(soar/ssm.tf:37-43).

  SEC-06:
    title: DB 무차별 대입 로그인
    criterion: 동일 5분 구간의 MySQL 인증 실패 수
    unit: 건
    severity_hint: HIGH
    detection: [CloudWatch]
    match:
      cloudwatch_alarm_suffix: ['-mysql-bruteforce']
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: ASR-BlockIpWithNacl
      wired: true               # SSM 문서 등록됨. 대시보드 승인 후 실행 경로
      reversible: true          # NACL Deny 규칙 삭제로 원복
      note: >-
        오탐 가능성 때문에 자동화에서 의도적으로 제외(README 2-2).
        GuardDuty 무차별 대입 finding 은 SSH/RDP 대상이라 EC2 자체 MySQL 은 못 잡는다.
        1차 탐지는 CloudWatch Logs 메트릭 필터(soar/cloudwatch.tf:78-89).
    verify:
      type: cloudwatch_metric
      namespace_suffix: /security
      metric: MySQLAuthFailure
      statistic: Sum
      period: 300
      needs_send_command: false

  SEC-07:
    title: DB 자격증명 하드코딩·.env 노출
    criterion: 코드·이미지에서 발견된 평문 자격증명 수
    unit: 개
    severity_hint: HIGH
    detection: [Trivy]
    match:
      sources: [Trivy]
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: ASR-RotateDbSecret
      wired: true
      reversible: false         # 로테이션은 이전 비밀번호로 되돌리지 않는다
      note: >-
        reversible=false 이므로 게이트 ④(04 §3.2)에서 자동 실행이 차단된다.
        승인 후 수동 실행만 허용.
    verify:
      type: trivy_report_diff
      scan_document: SCAN-ContainerImage
      mode: secret
      needs_send_command: true

  SEC-08:
    title: 웹 애플리케이션 공격(SQLi, DVWA)
    criterion: 동일 관찰 구간의 WAF 차단 룰 매치 수
    unit: 건
    severity_hint: HIGH
    detection: [Security Hub]
    match:
      securityhub_generator_contains: ['WAF.']
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: null
      wired: false
      reversible: true
      note: WAF 관리형 규칙·Rate Limit 조정. 콘솔/Terraform 수동 작업.
    verify:
      type: config_compliance
      needs_send_command: false
      note: WAF 매치 수는 CloudWatch 지표로도 확인 가능. 팀 확인 필요.

  SEC-09:
    title: 로깅·감사 추적 미흡
    criterion: 미준수 Config 규칙 수 (cloudtrail-enabled 등)
    unit: 개
    severity_hint: MEDIUM
    detection: [Config, Security Hub]
    match:
      config_rules: [cloudtrail-enabled]
      securityhub_generator_contains: ['CloudTrail.', 'Config.']
    remediation:
      planned_mode: BASELINE
      mode: MANUAL
      playbook: null
      wired: false
      reversible: true
      note: 기본 활성화 항목. 조치 대상이라기보다 상시 준수 확인용.
    verify:
      type: config_compliance
      rules: [cloudtrail-enabled]
      needs_send_command: false

  SEC-10:
    title: 리소스 과부하(CPU·메모리 80%)
    criterion: 동일 5분 평균 사용률
    unit: '%'
    severity_hint: MEDIUM
    detection: [CloudWatch]
    match:
      cloudwatch_alarm_suffix: ['-cpu-high', '-mem-high']
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: null
      wired: false
      reversible: true
      note: SNS 수신 후 담당자 조치. 자동 조치 없음(README 2-2).
    verify:
      type: cloudwatch_metric
      metrics: [CPUUtilization, MemoryUsedPercent]
      threshold: 80
      statistic: Average
      period: 300
      needs_send_command: false

  # ───────────────────────────────────────────────────────────────
  # 데모 데이터 전용 (static/js/data.js 가 쓰는 scenario 값)
  # 커버리지 보드 기본 집계에서는 제외된다.
  # ───────────────────────────────────────────────────────────────

  DETECT-01:
    title: 외부 IP의 비정상 접근 탐지
    criterion: 동일 10분 관찰 구간의 비정상 접근 수
    unit: 건
    severity_hint: CRITICAL
    demo_only: true
    maps_to: SEC-05
    detection: [GuardDuty]
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: ASR-BlockIpWithNacl
      wired: true
      reversible: true
    verify:
      type: cloudwatch_metric
      needs_send_command: false

  NMS-01:
    title: EC2 CPU 사용률 80% 초과
    criterion: 동일 5분 평균 CPU 사용률
    unit: '%'
    severity_hint: MEDIUM
    demo_only: true
    maps_to: SEC-10
    detection: [CloudWatch]
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: null
      wired: false
      reversible: true
    verify:
      type: cloudwatch_metric
      metrics: [CPUUtilization]
      threshold: 80
      needs_send_command: false

  NMS-02:
    title: EC2 메모리 사용률 80% 초과
    criterion: 동일 5분 평균 메모리 사용률
    unit: '%'
    severity_hint: HIGH
    demo_only: true
    maps_to: SEC-10
    detection: [CloudWatch]
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: null
      wired: false
      reversible: true
    verify:
      type: cloudwatch_metric
      metrics: [MemoryUsedPercent]
      threshold: 80
      needs_send_command: false
      note: CloudWatch Agent 커스텀 지표. NAT off 시 전송이 끊긴다(README:336).

  IAM-01:
    title: 글로벌 IAM 역할 신뢰 정책 검토
    criterion: 승인되지 않은 외부 계정 신뢰 항목 수
    unit: 개
    severity_hint: HIGH
    demo_only: true
    maps_to: SEC-05
    detection: [Security Hub]
    remediation:
      planned_mode: MANUAL
      mode: MANUAL
      playbook: null
      wired: false
      reversible: true
    verify:
      type: config_compliance
      needs_send_command: false
