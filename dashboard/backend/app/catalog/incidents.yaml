# 침해사례 카탈로그 — 대시보드 "침해사례" 탭의 정본
#
# 정본: 루트 README.md 2장 (2-1 공격 경로 원칙, 2-2 SEC-01~10 표)
# scenarios.yaml 과 분리한 이유:
#   - scenarios.yaml 은 탐지 분류(match)와 재검증 방식(verify)을 규정하는 **동작** 카탈로그다.
#     실 AWS finding 이 이 파일을 타고 SEC-xx 로 분류된다.
#   - 이 파일은 발표·문서용 **서술** 카탈로그다. 여기를 고쳐도 탐지·조치 동작은 바뀌지 않는다.
#   - 둘을 한 파일에 두면 발표 문구를 고치다 분류 규칙을 건드릴 위험이 있다.
#
# 각 항목
#   summary   한 줄 요약
#   basis     근거 문서 (README 2-2 의 '근거' 열)
#   attack    공격·재현 절차. 팀 소유 계정/VPC 안에서만 실행한다(README 2-1).
#   trace     흔적이 남는 위치 — 어느 로그·어느 서비스에서 보이는지
#   impact    성공했을 때의 영향
#   control   막는 방법(설계상 대응)

version: 1
updated: 2026-09-22

incidents:

  SEC-01:
    summary: 보안그룹 인바운드가 0.0.0.0/0 으로 열려 관리 포트가 인터넷에 노출된다.
    basis: SK쉴더스 클라우드 보안 가이드 3.1 (가상 리소스)
    attack:
      - "aws ec2 authorize-security-group-ingress --group-id <sg> --protocol tcp --port 22 --cidr 0.0.0.0/0"
      - "외부에서 nmap -Pn -p22 <대상> 으로 열린 포트 확인"
    trace:
      - "AWS Config 규칙 restricted-ssh 가 NON_COMPLIANT 로 평가"
      - "Security Hub 에 EC2.13 컨트롤 실패로 집계"
      - "CloudTrail 에 AuthorizeSecurityGroupIngress 호출 기록"
    impact: 자격증명 추측·무차별 대입의 출발점이 된다. 성공하면 내부 이동으로 이어진다.
    control: SSM Session Manager 전용 운용 + 인바운드 규칙 자동 회수(ASR-RevokeSecurityGroupIngress).

  SEC-02:
    summary: HTTP 평문 통신과 응답 보안 헤더 누락으로 중간자 공격·클릭재킹에 노출된다.
    basis: SK쉴더스 운영관리 / OWASP Secure Headers Project
    attack:
      - "curl -I http://<대상>/ 로 응답 헤더 확인"
      - "X-Content-Type-Options·X-Frame-Options·Strict-Transport-Security 부재 확인"
      - "Wireshark 로 평문 세션 쿠키 관찰"
    trace:
      - "docker-host 의 nginx access.log (CloudWatch Logs /<project>/<env>/web/nginx)"
      - "Security Hub 의 ELB·CloudFront 계열 컨트롤"
    impact: 세션 탈취, 응답 변조, 브라우저 보호 기능 미적용.
    control: Nginx 보안 헤더 일괄 적용. **ASR-HardenNginx 는 SSM 문서만 있고 호출 분기가 없어 현재 수동이다(README 5-1).**

  SEC-03:
    summary: MySQL 3306 이 외부 전체 주소에 열려 DB 가 직접 노출된다.
    basis: SK쉴더스 3.1 / Docker 보안 체크리스트 #3·#6·#17
    attack:
      - "aws ec2 authorize-security-group-ingress --group-id <db-sg> --protocol tcp --port 3306 --cidr 0.0.0.0/0"
      - "demo/trigger-auto-remediation.sh 로 재현 (대조군은 --manual)"
      - "nmap -Pn -p3306 <대상> 으로 노출 확인"
    trace:
      - "AWS Config 규칙 restricted-common-ports 가 NON_COMPLIANT"
      - "VPC Flow Logs 에 3306 접속 시도 기록"
      - "Security Hub 집계 → EventBridge(sh-asr) → asr_trigger"
    impact: 인증만 뚫리면 데이터 전체가 노출된다.
    control: "같은 위반을 SG 2개에 넣어 대조한다 — db-auto-sg(태그 있음)는 자동 회수, db-manual-sg 는 알림만."

  SEC-04:
    summary: 컨테이너 이미지에 알려진 취약점(CVE)이 남은 채로 배포된다.
    basis: CIS Docker Benchmark / Docker 보안 체크리스트 #21~23
    attack:
      - "구버전 베이스 이미지로 빌드해 ECR 에 push"
      - "demo/run-manual-scan.sh image 로 Trivy 점검 실행"
    trace:
      - "Trivy 리포트가 S3 스캔 결과 버킷에 적재"
      - "Inspector2 가 ECR push 이미지의 PACKAGE_VULNERABILITY 발행"
      - "GuardDuty 위협과 같은 자원이면 correlator 가 심각도를 한 단계 올린다"
    impact: 알려진 익스플로잇으로 컨테이너 내부 실행까지 이어질 수 있다.
    control: 수정 이미지로 교체·버전 고정·Dockerfile USER 지정 후 동일 검사 DB 로 재검사.

  SEC-05:
    summary: 과도한 권한의 IAM 사용자 Access Key 가 외부에 노출된다.
    basis: SK쉴더스 계정·권한 관리
    attack:
      - "테스트용 Access Key 를 공개 위치에 노출시켜 외부 호출 유도"
      - "노출된 키로 aws sts get-caller-identity / 열람 API 호출"
    trace:
      - "GuardDuty UnauthorizedAccess:IAMUser / CredentialAccess:IAMUser finding"
      - "CloudTrail 에 비정상 출발지 API 호출 기록"
      - "IAM Access Analyzer 의 외부 접근 분석"
    impact: 키 권한 범위 전체가 그대로 공격자 권한이 된다.
    control: 키 즉시 비활성화는 자동(ASR-DisableExposedAccessKey), 최소권한 재작성은 수동.

  SEC-06:
    summary: DB 계정에 대한 무차별 대입 로그인 시도가 반복된다.
    basis: SK쉴더스 운영관리 / KISA 계정 잠금 정책
    attack:
      - "hydra -l <user> -P <wordlist> mysql://<대상>"
      - "동일 출발지에서 5분 내 10회 이상 인증 실패 유발"
    trace:
      - "MySQL error.log 의 'Access denied for user' (CloudWatch Logs /<project>/<env>/db/mysql)"
      - "CloudWatch Logs 메트릭 필터 → MySQLAuthFailure → 알람(10회/5분) → SNS"
    impact: 약한 비밀번호면 DB 접근 권한 획득.
    control: "출발지 IP 를 Private NACL Deny(1~99)로 차단. 오탐 가능성 때문에 자동화에서 의도적으로 제외했다."
    note: GuardDuty 무차별 대입 finding 은 SSH/RDP 대상이라 EC2 자체 MySQL 은 잡지 못한다. 1차 탐지는 CloudWatch 메트릭 필터다.

  SEC-07:
    summary: DB 자격증명이 코드·이미지·.env 에 평문으로 들어간다.
    basis: CWE-798 / Docker 보안 체크리스트 #9~12·#18·#24
    attack:
      - "trivy fs --scanners secret <경로> 로 평문 자격증명 탐지"
      - "이미지 레이어에서 .env 추출"
    trace:
      - "Trivy secret 스캔 결과가 S3 스캔 결과 버킷에 적재"
    impact: 이미지에 접근한 누구나 DB 자격증명을 얻는다.
    control: Secrets Manager 로 이전 + 앱 전용 계정 분리 + 로테이션(ASR-RotateDbSecret).
    note: 로테이션은 이전 비밀번호로 되돌릴 수 없어 게이트 ④에서 자동 실행이 차단된다. 승인 후 수동 실행만 허용.

  SEC-08:
    summary: 웹 애플리케이션 취약점(SQL 인젝션 등)을 통한 공격.
    basis: OWASP Top 10 A03 / KISA 웹 취약점 점검 가이드
    attack:
      - "DVWA 의 SQL Injection 메뉴에서 ' OR '1'='1 입력"
      - "sqlmap -u 'http://<대상>/vulnerabilities/sqli/?id=1' --batch"
      - "OWASP ZAP 자동 스캔"
    trace:
      - "WAFv2 룰 매치 로그 → Security Hub"
      - "nginx access.log 의 요청 패턴"
    impact: DB 내용 열람·변조, 인증 우회.
    control: WAF 관리형 규칙 + Rate Limit. **WAFv2 는 ALB 에만 붙는다(NLB 불가) — enable_alb 가 꺼져 있으면 이 시연은 성립하지 않는다.**

  SEC-09:
    summary: 로깅·감사 추적이 없어 침해 발생 시 경위를 재구성할 수 없다.
    basis: SK쉴더스 운영관리
    attack:
      - "CloudTrail 비활성화 또는 로그 파일 검증 해제 시도"
      - "컨테이너 로그를 호스트 밖으로 내보내지 않는 구성"
    trace:
      - "AWS Config 규칙 cloudtrail-enabled 평가"
      - "Security Hub 의 로깅 관련 컨트롤"
    impact: 사고 조사·증적 제출 불가. 규제 대응도 불가능하다.
    control: 다중 리전 CloudTrail + 로그 파일 검증 + KMS 암호화 + S3 퍼블릭 차단, VPC Flow Logs 상시 수집.

  SEC-10:
    summary: 자원 과부하로 서비스 응답이 지연되거나 중단된다.
    basis: 교재 Monitoring Hands-on
    attack:
      - "jmeter 또는 ab 로 동시 요청 부하 인가"
      - "stress-ng --cpu 2 --vm 2 로 인스턴스 자원 소진"
    trace:
      - "CloudWatch AWS/EC2 CPUUtilization"
      - "CloudWatch Agent 커스텀 지표 MemoryUsedPercent (<project>/host)"
      - "5분 평균 2회 연속 80% 초과 시 알람 → SNS"
    impact: 정상 요청 지연·실패. 3계층 중 앱 계층부터 영향을 받는다.
    control: 알림 수신 후 담당자가 부하 프로세스를 확인하고 조정한 뒤 동일 5분 평균으로 재확인.
    note: CloudWatch Agent 전송이 끊기면(NAT off) 메모리 알람이 동작하지 않는다.
