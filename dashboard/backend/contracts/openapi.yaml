openapi: 3.1.0
info:
  title: Local SOAR Dashboard API
  version: 1.0.0
  description: >-
    실데이터용 API 계약. 공급자 연결 전에는 데이터 요청에 503 DATA_SOURCE_NOT_CONFIGURED를 반환한다.
    /api/auth/session, /api/auth/login, /api/auth/logout은 별도 인증 부트스트랩이다.
    보호된 응답에는 Cache-Control no-store를 적용한다.
    시각은 UTC ISO 8601, 범위는 [from,to), 최대 31일이다.
    생략한 기간은 현재 서버 시각 직전 24시간이다.
    cursor는 필터·현재 사용자 권한 범위에 결합한 서명 토큰이다.
servers:
  - url: http://127.0.0.1:5051
security:
  - session: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: 프로세스 생존 상태. AWS·보호 대상 상태를 뜻하지 않는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthEnvelope'}
  /api/events:
    get:
      operationId: listEvents
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/Resource'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Severity'}
        - {$ref: '#/components/parameters/Status'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 관측 시각 내림차순·ID 오름차순 이벤트 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventsEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/summary:
    get:
      operationId: getSummary
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/Resource'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Severity'}
        - {$ref: '#/components/parameters/Status'}
      responses:
        '200':
          description: 페이지와 무관한 필터 전체 집계. 분모가 0이면 해결률 null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SummaryEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/metrics:
    get:
      operationId: getMetrics
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/Resource'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - name: periodSeconds
          in: query
          schema: {type: integer, enum: [60, 300, 3600], default: 300}
      responses:
        '200':
          description: 명시한 집계 주기의 CPU·메모리 관측 시계열. CloudTrail로 같은 인스턴스 프로필을 확인한 이전 EC2 표본을 연결하며, 조회자 자원 범위를 각각 적용한다. 식별 불가 이력은 meta.partial·warnings에 표시한다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricsEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/vulnerabilities:
    get:
      operationId: listVulnerabilities
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/Resource'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Severity'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: source
          in: query
          schema: {type: string, enum: [Inspector, Trivy]}
      responses:
        '200':
          description: >-
            관측 시각 내림차순·ID 오름차순 정규화된 취약점(현재 ACTIVE). 기간 필터는 가장 최근 탐지 시각
            (observedAt = Inspector lastObservedAt)이 [from, to) 안인 결과다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VulnerabilitiesEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/infra/status:
    get:
      operationId: getInfrastructureStatus
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/Resource'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: >-
            저장된 상태 증거 조회. 새 점검을 실행하지 않는다. components 는 EC2 서버 가동 상태, tiers 는 3계층
            (Nginx·Flask·MySQL)으로 점검 결과를 저장하는 작업이 없으면 unknown, alarms 는 CloudWatch 지표 알람 상태다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InfrastructureEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/history:
    get:
      operationId: getHistory
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/Region'}
        - {$ref: '#/components/parameters/Resource'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: eventId, in: query, schema: {type: string}}
        - {name: actionId, in: query, schema: {type: string}}
        - {name: jobId, in: query, schema: {type: string}}
      responses:
        '200':
          description: >-
            불변 감사 기록과 현재 작업 상태. 지정 jobId의 jobs는 이력 페이지·기간과
            독립적으로 반환하되 현재 사용자와 리소스 범위를 매번 확인한다.
            items에는 DynamoDB 자동조치 판정 기록(source=automatic)도 포함한다. 테이블 미설정·조회 실패는
            meta.warnings(실패 시 partial=true)로 알린다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/events/{eventId}/approve:
    post:
      operationId: approveEvent
      x-permission: soar:approve
      parameters:
        - {$ref: '#/components/parameters/EventId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveRequest'}
      responses:
        '200':
          description: 승인 저장. 실행 작업은 생성하지 않는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/events/{eventId}/cancel:
    post:
      operationId: cancelApproval
      x-permission: soar:cancel
      parameters:
        - {$ref: '#/components/parameters/EventId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200':
          description: 실행 접수 전 취소. 실행 중단·인프라 원복과 다르다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /execute:
    post:
      operationId: executeAction
      x-permission: soar:execute
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecuteRequest'}
      responses:
        '202':
          description: 승인한 스냅샷으로 영속 작업 접수
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /verify:
    post:
      operationId: verifyAction
      x-permission: soar:verify
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyRequest'}
      responses:
        '202':
          description: 실행된 조치에 대해 동일 조건 검증 작업 접수
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifyQueuedEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/drills/catalog:
    get:
      operationId: getDrillCatalog
      x-permission: dashboard:read
      description: >-
        공격·대응 실습(1차 관측·구조)의 실행 유형과 SEC 시나리오 카탈로그, 실행 환경 상태.
        support 는 보안 시나리오 문서의 정적 분류이며 실행 승인이 아니다.
      responses:
        '200':
          description: 실행 유형·시나리오·환경·지원상태 범례
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrillCatalogEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/drills:
    get:
      operationId: listDrills
      x-permission: dashboard:read
      description: 실습 실행 이력 목록. 1차 범위에는 실행 경로가 없어 비어 있다.
      responses:
        '200':
          description: 실습 실행 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrillListEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/drills/{runId}:
    get:
      operationId: getDrill
      x-permission: dashboard:read
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 실습 실행 상세와 타임라인
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/assistant/status:
    get:
      operationId: getAssistantStatus
      x-permission: dashboard:read
      description: >-
        대시보드 도우미(챗봇)의 사용 가능 여부와 상한. 꺼져 있거나 AWS 연결·IAM 이 없으면 enabled=false 이며 오류로 위장하지 않는다.
        도우미는 조회 전용이다(readOnly=true, tools 는 읽기 도구 이름 목록).
      responses:
        '200':
          description: enabled·model·readOnly·limits·tools
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantStatusEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/assistant/chat:
    post:
      operationId: assistantChat
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      description: >-
        조회 전용 대화. 본문의 messages 는 user/assistant 가 번갈아 오고 user 로 시작·끝나야 한다(최대 12개·각 2000자).
        서버가 읽기 도구만 사용자 본인 권한으로 호출해 답한다. 변경 도구는 없다. POST 이지만 CSRF 만 요구하고 viewer 도 쓸 수 있다.
        질문·답변 원문은 감사 기록에 남기지 않고 도구 이름과 토큰 수만 남긴다. 사용자당 10분 20회·하루 토큰 예산을 넘으면 429,
        꺼져 있으면 503 ASSISTANT_DISABLED.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantChatRequest'}
      responses:
        '200':
          description: 답변과 사용한 도구·토큰
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantChatEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/assistant/report:
    post:
      operationId: assistantReport
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      description: >-
        화면별 AI 요약 보고서(보안 이벤트·취약점 점검·인프라 모니터링·보안 시나리오·허니팟). 숫자는 서버가 집계(facts)하고
        모델은 그 수치로 문장만 쓴다. 도구는 없고 조회 전용이다. POST 이지만 CSRF 만 요구하고 viewer 도 쓸 수 있다.
        facts 안의 문자열은 신뢰하지 않는 데이터로 모델에 전달하고, 모델 본문에 facts 에 없는 수치나 빠진 필수 항목이 있으면 warnings 로 알린다.
        같은 사용자·같은 조건은 5분간 저장한 보고서를 돌려주고(cached=true, 모델 호출 없음), 사용자당 10분 6회·하루 토큰 예산(도우미와 공유)을
        넘으면 429, 꺼져 있으면 503 ASSISTANT_DISABLED, 원천을 모두 읽지 못하면 502 REPORT_SOURCE_UNAVAILABLE.
        본문·집계 원문은 감사 기록에 남기지 않고 화면·캐시 여부·토큰 수·경고 수만 남긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantReportRequest'}
      responses:
        '200':
          description: markdown 본문과 근거 facts·경고·사용 토큰
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantReportEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/honeypot/status:
    get:
      operationId: getHoneypotStatus
      x-permission: dashboard:read
      description: >-
        허니팟이 동작하는지 원천별 근거로 판정한다(미끼 인스턴스·로그 수신·AI 분석 적용·탐지 알람·자동 차단).
        미배포(HONEYPOT_LOG_GROUP 없음)만 200 deployed=false 이고, 읽지 못한 원천은 unknown 이며 정상으로 바꾸지 않는다.
      responses:
        '200':
          description: verdict(ok·waiting·partial·unknown·not_deployed)와 카드 5개
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoneypotStatusEnvelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/honeypot/sessions:
    get:
      operationId: listHoneypotSessions
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: ip, in: query, schema: {type: string, format: ipv4}}
        - {name: intent, in: query, schema: {type: string, enum: [recon, credential-access, lateral-movement, exfiltration, impact, unknown]}}
      responses:
        '200':
          description: 시작 시각 내림차순 세션 요약. cursor 는 기간·필터에 결합된다. 읽지 못한 행은 meta.warnings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/honeypot/sessions/{sessionId}:
    get:
      operationId: getHoneypotSession
      x-permission: dashboard:read
      description: >-
        세션 재생(입력 명령과 미끼 응답 순서)·로그인 시도·AI 분석. 비밀번호는 기본으로 값 없이 길이만 준다.
        revealPasswords=true 는 조치 담당자 역할(BLOCKLIST_WRITE_ROLES)만 가능하고 감사 기록을 남긴다.
        모든 문자열은 공격자가 조종할 수 있는 값이라 화면은 텍스트로만 그려야 한다.
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{12}$'}}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {name: revealPasswords, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: 세션 상세
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/honeypot/stats:
    get:
      operationId: getHoneypotStats
      x-permission: dashboard:read
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: 시간대별 접속·IP·명령·사용자명·의도·위험도 집계와 관계 그래프(IP→세션→명령). 비밀번호는 집계하지 않는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/honeypot/timeline:
    get:
      operationId: getHoneypotTimeline
      x-permission: dashboard:read
      description: >-
        한 공격 IP 의 파이프라인 단계(접속·로그인·명령·AI 분석·알람·판정·SSM·NACL). 단계 상태는
        done·missing(기록 없음)·failed·pending·unknown(읽지 못함)이며 서로 다른 뜻이다.
      parameters:
        - {name: ip, in: query, required: true, schema: {type: string, format: ipv4}}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: 단계 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/blocklist:
    get:
      operationId: listBlockedIps
      x-permission: dashboard:read
      description: >-
        차단 IP 목록. 실제 차단의 기준은 NACL 1~99 Deny 이고 표(ip_blocklist)와 다르면 mismatch 로 알린다
        (nacl-missing·record-missing·nacl-still-blocked·rule-changed). NACL 을 읽지 못하면 inNacl=null 과 경고를 준다.
        format=csv|download 는 보고서 파일(CSV 는 수식 주입을 막는다).
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {name: format, in: query, schema: {type: string, enum: [json, csv, download], default: json}}
      responses:
        '200':
          description: 차단 목록과 상태별 개수
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
            text/csv:
              schema: {type: string}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/blocklist/{ip}/release:
    post:
      operationId: releaseBlockedIp
      x-permission: blocklist:write
      description: >-
        오탐 해제. ASR-UnblockIpWithNacl 을 시작한다(NACL 의 그 번호가 Deny+그 IP/32 일 때만 삭제). 202 는 접수이며
        해제 완료가 아니다 — 완료는 다음 목록 조회의 NACL 대조로 확인한다. allowlist=true 면 이후 자동 차단하지 않는다.
        같은 Idempotency-Key 재시도는 같은 응답이고, 다른 본문에 재사용하면 409.
      parameters:
        - {name: ip, in: path, required: true, schema: {type: string, format: ipv4}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlocklistReleaseRequest'}
      responses:
        '202':
          description: 해제 접수(SSM 실행 시작)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '200':
          description: NACL 에 Deny 가 이미 없어 표만 해제로 표시
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/blocklist/{ip}:
    patch:
      operationId: updateBlockedIp
      x-permission: blocklist:write
      description: >-
        차단 기간(durationHours 1·24·168, 0 은 영구, 지금부터 계산) 변경과 오탐 예외 등록(allowlisted). expectedVersion 필수.
      parameters:
        - {name: ip, in: path, required: true, schema: {type: string, format: ipv4}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlocklistPatchRequest'}
      responses:
        '200':
          description: 적용됨
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: soar_session}
  parameters:
    Region: {name: region, in: query, description: 생략은 허용 전체 리전. global·unknown 허용., schema: {type: string}}
    Resource: {name: resource, in: query, schema: {type: string}}
    From: {name: from, in: query, description: 포함 시작 UTC 시각. to와 함께 지정., schema: {type: string, format: date-time}}
    To: {name: to, in: query, description: 제외 종료 UTC 시각. from과 함께 지정., schema: {type: string, format: date-time}}
    Severity: {name: severity, in: query, schema: {$ref: '#/components/schemas/Severity'}}
    Status: {name: status, in: query, schema: {$ref: '#/components/schemas/ActionState'}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 4096}}
    EventId: {name: eventId, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    CsrfToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 1}}
  responses:
    Error:
      description: >-
        400 형식·필터, 401 인증, 403 권한, 404 범위 내 대상 없음,
        409 상태·버전·멱등성·승인만료, 422 업무 매개변수, 429 호출 제한,
        503 의존성 불가, 500 내부 오류. 내부 예외·비밀값은 노출하지 않는다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    AssistantStatusEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [enabled, readOnly, limits, tools]
          properties:
            enabled: {type: boolean}
            model: {type: [string, 'null']}
            readOnly: {type: boolean, const: true}
            limits: {type: object, additionalProperties: {type: integer}}
            tools: {type: array, items: {type: string}}
            report:
              type: object
              description: 화면별 AI 요약 보고서 상태(enabled·ratePer10Min·maxOutputTokens·cacheSeconds·views).
        meta: {$ref: '#/components/schemas/Meta'}
    AssistantReportRequest:
      type: object
      required: [view]
      properties:
        view: {type: string, enum: [events, vulnerabilities, infrastructure, drills, honeypot]}
        hours: {type: integer, minimum: 1, maximum: 744, description: '취약점·시나리오는 서버가 744(31일)로 고정한다.'}
        endOffset: {type: integer, minimum: 0, maximum: 744}
        region: {type: string}
        resource: {type: string}
        severity: {type: string, enum: ['', CRITICAL, HIGH, MEDIUM, LOW, INFORMATIONAL, UNKNOWN]}
        status: {type: string, description: 'ActionState 값(예 PENDING_APPROVAL). 빈 문자열이면 전체.'}
        source: {type: string}
        search: {type: string, maxLength: 128}
    AssistantReportEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [view, title, period, filters, generatedAt, model, facts, unavailable, markdown, warnings, usage, cached]
          properties:
            view: {type: string}
            title: {type: string}
            period: {type: object, properties: {from: {type: string}, to: {type: string}, hours: {type: integer}, endOffset: {type: integer}}}
            filters: {type: object, additionalProperties: {type: string}}
            generatedAt: {type: string}
            model: {type: [string, 'null']}
            facts: {type: object, description: '서버가 계산한 수치. 필수 항목 값 포함. 비밀번호·토큰 필드 없음.'}
            unavailable: {type: array, items: {type: string}}
            markdown: {type: string}
            warnings: {type: array, items: {type: string}}
            usage:
              type: object
              properties: {inputTokens: {type: integer}, outputTokens: {type: integer}}
            cached: {type: boolean}
        meta: {$ref: '#/components/schemas/Meta'}
    AssistantChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string, enum: [user, assistant]}
              content: {type: string, minLength: 1, maxLength: 2000}
    AssistantChatEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [answer, toolsUsed, usage, truncated]
          properties:
            answer: {type: string}
            toolsUsed:
              type: array
              items:
                type: object
                required: [name, args]
                properties:
                  name: {type: string}
                  args: {type: object}
            usage:
              type: object
              properties:
                inputTokens: {type: integer}
                outputTokens: {type: integer}
            truncated: {type: boolean}
        meta: {$ref: '#/components/schemas/Meta'}
    Meta:
      type: object
      required: [requestId, schemaVersion, asOf, partial, warnings]
      properties:
        requestId: {type: string, minLength: 1}
        schemaVersion: {type: string, const: '1'}
        asOf:
          type: string
          format: date-time
          description: >-
            데이터 기준 시각. 탐지·취약점을 DynamoDB 적재(EVENT_SOURCE·VULNERABILITY_SOURCE=dynamodb)에서
            읽으면 마지막 전체 대조 성공 시각이고, 지연·실패·건수 불일치는 warnings 로 알린다.
        partial: {type: boolean}
        warnings: {type: array, items: {type: string}}
        dataMode: {type: string, const: live}
    Envelope:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data: {type: object}
        meta: {$ref: '#/components/schemas/Meta'}
    ErrorEnvelope:
      type: object
      required: [error, meta]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
        meta: {$ref: '#/components/schemas/Meta'}
    Severity: {type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW, INFORMATIONAL, UNKNOWN]}
    ActionState:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, CANCELLED, QUEUED, RUNNING, EXECUTED, EXECUTION_FAILED, VERIFY_QUEUED, VERIFYING, VERIFIED, VERIFICATION_FAILED, VERIFICATION_ERROR, RECONCILING]
    DrillSupport: {type: string, enum: [runnable, prep-needed, observe-only, design-needed]}
    DrillType:
      type: object
      required: [id, name, tool, kind, sources]
      properties:
        id: {type: string}
        name: {type: string}
        tool: {type: string}
        kind: {type: string, enum: [attack, scenario, load]}
        sources: {type: array, items: {type: string}}
        variants:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
              note: {type: string}
        note: {type: string}
    DrillScenario:
      type: object
      required: [id, purpose, types, sources, response, support, supportLabel, observation]
      properties:
        id: {type: string}
        purpose: {type: string}
        types: {type: array, items: {type: string}}
        sources: {type: array, items: {type: string}}
        response: {type: string}
        support: {$ref: '#/components/schemas/DrillSupport'}
        supportLabel: {type: string}
        observation: {type: string, enum: [connected, disconnected]}
        note: {type: string}
    DrillCatalogEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data:
              type: object
              required: [types, scenarios, environment, supportLegend]
              properties:
                types: {type: array, items: {$ref: '#/components/schemas/DrillType'}}
                scenarios: {type: array, items: {$ref: '#/components/schemas/DrillScenario'}}
                environment:
                  type: object
                  properties:
                    dataSourceConnected: {type: boolean}
                    providerState: {type: [string, 'null']}
                    region: {type: [string, 'null']}
                    isolationVerified: {type: string}
                    executionMode: {type: string}
                supportLegend: {type: object, additionalProperties: {type: string}}
    DrillListEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items: {type: array, items: {type: object}}
                nextCursor: {type: [string, 'null']}
    Measurement:
      type: [object, 'null']
      properties:
        value: {type: [number, 'null']}
        unit: {type: [string, 'null']}
        observedAt: {type: [string, 'null'], format: date-time}
        source: {type: string}
        resource: {type: [string, 'null']}
        criterionVersion: {type: [string, 'null']}
        text: {type: [string, 'null'], description: 수치가 아닌 상태 설명(자동조치 기록의 before_state·after_state)}
    Event:
      type: object
      required: [id, title, severity, resource, actionState, version, allowedActions, updatedAt]
      properties:
        id: {type: string}
        title: {type: string}
        severity: {$ref: '#/components/schemas/Severity'}
        resource: {type: string}
        region: {type: string}
        accountId: {type: string}
        actionState: {$ref: '#/components/schemas/ActionState'}
        version: {type: integer, minimum: 1}
        allowedActions: {type: array, uniqueItems: true, items: {type: string, enum: [approve, cancel, execute, verify]}}
        updatedAt: {type: string, format: date-time}
        observedAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        approvalId: {type: [string, 'null']}
        actionId: {type: [string, 'null']}
        beforeState: {$ref: '#/components/schemas/Measurement'}
        afterState: {$ref: '#/components/schemas/Measurement'}
        sourceIp: {type: [string, 'null']}
        sourceLocation:
          type: [object, 'null']
          properties:
            lat: {type: number}
            lon: {type: number}
            country: {type: [string, 'null']}
            city: {type: [string, 'null']}
        geoStatus: {type: [string, 'null'], enum: [located, country-only, unknown, null]}
        actionable: {type: boolean, description: 승인·실행할 플레이북이 있는지. false 면 탐지 기록}
        severityBumped: {type: boolean, description: correlator 가 GuardDuty 위협과 같은 자원의 CVE 로 위험도를 한 단계 올렸는지}
        relatedCves: {type: array, items: {type: string}, description: 상관분석에서 찾은 같은 자원의 CVE}
        source: {type: string, description: 실제 탐지 서비스(GuardDuty·Security Hub·Config·WAF)}
        scenario: {type: string}
        description: {type: [string, 'null'], description: AWS 원문 설명(최대 1000자)}
        controlId: {type: [string, 'null'], description: Security Hub 규칙 ID(EC2.2 등)}
        findingType: {type: [string, 'null'], description: GuardDuty 유형(원래 형식 ThreatPurpose:Resource/Name)}
        remediation:
          type: [object, 'null']
          description: AWS 원문 조치 안내. 링크가 없으면 규칙 ID 로 AWS 공식 조치 문서 주소를 만든다(https 만).
          properties:
            text: {type: [string, 'null']}
            url: {type: [string, 'null'], format: uri}
        guidance: {$ref: '#/components/schemas/Guidance'}
        autoRemediation: {$ref: '#/components/schemas/AutoRemediation'}
    Guidance:
      type: [object, 'null']
      description: 팀이 쓴 한글 설명(AWS 원문과 별개). 설명표에 없는 탐지는 null.
      properties:
        key: {type: string}
        kind: {type: string, enum: [control, guardduty, guardduty-family, config, waf, product]}
        title: {type: string}
        problem: {type: string}
        risk: {type: string}
        fix: {type: array, items: {type: string}}
        where: {type: [string, 'null'], description: 이 프로젝트에서 고치는 곳(Terraform 소유 경계)}
        whereKey: {type: string, enum: [terraform, sg, iam, iam-user, account, patch, investigate]}
        scenario: {type: [string, 'null']}
        note: {type: [string, 'null']}
    AutoRemediation:
      type: [object, 'null']
      description: >-
        자동 조치 판정. asr_trigger·EventBridge 규칙을 현재 설정(AUTO_REMEDIABLE_*·ENABLE_AUTO_REMEDIATION)으로
        계산한 예상이며 실제 판정은 조치 이력(/api/history)의 기록이 기준이다. 설정을 모르면 mode=unknown.
      properties:
        mode: {type: string, enum: [auto, conditional, dry-run, manual, none, unknown]}
        label: {type: string}
        playbookId: {type: [string, 'null']}
        action: {type: [string, 'null']}
        condition: {type: [string, 'null']}
        reason: {type: string}
        basis: {type: string}
    ExecutionEvidence:
      type: [object, 'null']
      description: >-
        자동 조치 SSM 실행 결과(GetAutomationExecution 단계 출력). 조치 문서가 실행 직후 보고한 값이며
        재검증이 아니다(verification 은 항상 NOT_RUN).
      properties:
        status: {type: [string, 'null'], description: SSM 실행 상태(Success·Failed 등)}
        document: {type: [string, 'null']}
        step: {type: [string, 'null']}
        before: {type: [array, 'null'], items: {type: string}}
        after: {type: [array, 'null'], items: {type: string}}
        removed: {type: array, items: {type: string}, description: 조치 전에만 있던 줄}
        added: {type: array, items: {type: string}, description: 조치 후에 생긴 줄}
        changed: {type: [boolean, 'null']}
        failureMessage: {type: [string, 'null']}
        startedAt: {type: [string, 'null'], format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        source: {type: string, const: ssm-output}
        verification: {type: string, const: NOT_RUN}
    Alarm:
      type: object
      required: [name, state, kind]
      properties:
        name: {type: string}
        label: {type: string}
        kind: {type: string, enum: [cpu, memory, mysql-bruteforce, ssh-reject, waf, pipeline, other]}
        scenario: {type: [string, 'null']}
        host: {type: [string, 'null']}
        state: {type: string, enum: [OK, ALARM, INSUFFICIENT_DATA]}
        noData: {type: boolean, description: OK 이지만 데이터가 없어 누락 데이터를 정상으로 처리한 상태(treat_missing_data=notBreaching)}
        needsCheck: {type: boolean, description: 사람이 확인해야 하는 상태. INSUFFICIENT_DATA 이거나, 계속 들어와야 하는 지표(cpu·memory)의 noData. 사건이 있어야 지표가 생기는 알람의 noData 는 false}
        reason: {type: [string, 'null']}
        updatedAt: {type: [string, 'null'], format: date-time}
        metric: {type: [string, 'null']}
        namespace: {type: [string, 'null']}
        threshold: {type: [number, 'null']}
        comparison: {type: [string, 'null']}
        periodSeconds: {type: [integer, 'null']}
        evaluationPeriods: {type: [integer, 'null']}
        notifies: {type: boolean}
        autoResponse:
          type: [object, 'null']
          description: 무차별 대입 알람(SEC-06A·SEC-06B)의 자동 대응(공격 IP NACL 차단) 설정
          properties:
            mode: {type: string, enum: [auto, dry-run, manual]}
            label: {type: string}
            detail: {type: string}
        resource: {type: [string, 'null']}
        region: {type: [string, 'null']}
        accountId: {type: [string, 'null']}
    Evidence:
      type: object
      required: [eventId, actionId, jobId, actor, source, decision, playbookId, playbookVersion, parametersHash, beforeState, afterState, executionId, verification, createdAt, updatedAt, requestId]
      properties:
        eventId: {type: string}
        actionId: {type: [string, 'null']}
        jobId: {type: [string, 'null']}
        actor: {type: [string, 'null']}
        source: {type: string, enum: [manual, automatic]}
        decision: {type: string}
        playbookId: {type: [string, 'null']}
        playbookVersion: {type: [string, 'null']}
        parametersHash: {type: string}
        beforeState: {$ref: '#/components/schemas/Measurement'}
        afterState: {$ref: '#/components/schemas/Measurement'}
        executionId: {type: [string, 'null']}
        verification: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        requestId: {type: [string, 'null']}
        automationStatus:
          type: string
          enum: [NOTIFIED, DRY_RUN, IN_PROGRESS, SUCCESS, FAILED, TIMED_OUT, CANCELLED, NO_CHANGE, UNKNOWN]
          description: >-
            자동조치(source=automatic) 기록의 상태. SUCCESS 는 실행 성공이며 재검증 전이다(해결 아님).
            NO_CHANGE 는 이미 조치된 상태라 실행하지 않은 판정(actionState=CANCELLED)
        occurrenceCount: {type: integer, minimum: 1, description: 같은 finding·같은 판정의 반복 횟수(자동조치 기록)}
        lastSeenAt: {type: string, format: date-time, description: 마지막 판정 시각. 자동조치 기록의 정렬·기간 기준}
        findingId: {type: string}
        findingType: {type: [string, 'null']}
        reason: {type: [string, 'null'], description: asr_trigger 가 남긴 판정 이유(자동조치 기록 v3)}
        controlId: {type: [string, 'null'], description: 규칙 ID(EC2.2 등) 또는 SEC-06A·SEC-06B}
        controlTitle: {type: [string, 'null'], description: 규칙의 한글 이름(설명표)}
        execution: {$ref: '#/components/schemas/ExecutionEvidence'}
    HealthEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data: {type: object, required: [status, dataSourceConnected], additionalProperties: false, properties: {status: {type: string, const: ok}, dataSourceConnected: {type: boolean}}}
    EventsEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/Event'}}
                nextCursor: {type: [string, 'null']}
    SummaryEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              type: object
              required: [totalEvents, bySeverity, pendingApproval, verifiedEvents, resolutionRate, scope]
              properties:
                totalEvents: {type: integer, minimum: 0}
                bySeverity: {type: object, additionalProperties: {type: integer, minimum: 0}}
                pendingApproval: {type: integer, minimum: 0}
                verifiedEvents: {type: integer, minimum: 0}
                resolutionRate: {type: [number, 'null'], minimum: 0, maximum: 100}
                scope: {type: object}
                openVulnerabilities:
                  type: ['object', 'null']
                  description: >-
                    열린 취약점 수(v20.5). /api/vulnerabilities 를 [to-31일, to) 로 조회한 것과 같은 기준이며 from 과는 무관하다.
                    total·bySeverity 는 region·resource 필터를, byRegion 은 resource 필터만 따른다. 취약점 원본 조회 실패 시 null.
                  properties:
                    total: {type: integer, minimum: 0}
                    bySeverity: {type: object, additionalProperties: {type: integer, minimum: 0}}
                    byRegion:
                      type: object
                      description: 리전별 {total, bySeverity} (통합 관제 지역 패널)
                      additionalProperties:
                        type: object
                        properties:
                          total: {type: integer, minimum: 0}
                          bySeverity: {type: object, additionalProperties: {type: integer, minimum: 0}}
                automation:
                  type: [object, 'null']
                  description: >-
                    자동 대응 현황(v23). /api/history 자동조치 기록과 같은 기준(마지막 발생 시각이 [from,to), region·resource
                    필터). 테이블 설정이 없으면 {configured:false}, 읽기 실패는 null.
                  properties:
                    configured: {type: boolean}
                    total: {type: integer, minimum: 0}
                    byStatus: {type: object, additionalProperties: {type: integer, minimum: 0}}
                    byDecision: {type: object, additionalProperties: {type: integer, minimum: 0}}
                    autoExecuted: {type: integer, minimum: 0}
                    succeeded: {type: integer, minimum: 0, description: SSM 실행 성공(재검증 전)}
                    failed: {type: integer, minimum: 0}
                    inProgress: {type: integer, minimum: 0}
                    noChange: {type: integer, minimum: 0}
                    manual: {type: integer, minimum: 0}
                    dryRun: {type: integer, minimum: 0}
                    recent:
                      type: array
                      items:
                        type: object
                        properties:
                          actionId: {type: string}
                          eventId: {type: string}
                          findingType: {type: [string, 'null']}
                          controlId: {type: [string, 'null']}
                          controlTitle: {type: [string, 'null']}
                          decision: {type: string}
                          status: {type: string}
                          reason: {type: [string, 'null']}
                          resource: {type: [string, 'null']}
                          lastSeenAt: {type: string, format: date-time}
                alarms:
                  type: [object, 'null']
                  description: CloudWatch 지표 알람 요약(v23). 알람 이름 접두어 설정이 없거나 읽기 실패면 null.
                  properties:
                    total: {type: integer, minimum: 0}
                    alarm: {type: integer, minimum: 0}
                    insufficientData: {type: integer, minimum: 0}
                    noData: {type: integer, minimum: 0}
                    needsCheck: {type: integer, minimum: 0}
                    firing:
                      type: array
                      items:
                        type: object
                        properties:
                          name: {type: string}
                          label: {type: string}
                          scenario: {type: [string, 'null']}
                          updatedAt: {type: [string, 'null'], format: date-time}
                          autoResponse: {type: [object, 'null']}
    MetricsEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              type: object
              required: [series, thresholds, periodSeconds]
              properties:
                periodSeconds: {type: integer, enum: [60, 300, 3600]}
                thresholds: {type: object, required: [cpu, memory], properties: {cpu: {type: number}, memory: {type: number}}}
                series:
                  type: array
                  items:
                    type: object
                    required: [resource, metric, unit, points]
                    properties:
                      resource: {type: string}
                      instanceIds: {type: array, items: {type: string}, description: 같은 서버 역할에 연결된 과거·현재 EC2 인스턴스 ID}
                      metric: {type: string, enum: [cpu, memory]}
                      unit: {type: string, const: '%'}
                      points:
                        type: array
                        items:
                          type: object
                          required: [timestamp, value]
                          properties:
                            timestamp: {type: string, format: date-time}
                            value: {type: [number, 'null']}
                            instanceId: {type: [string, 'null'], description: 값이 있으면 해당 표본의 실제 EC2 인스턴스 ID}
    VulnerabilitiesEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                nextCursor: {type: [string, 'null']}
                items:
                  type: array
                  items:
                    type: object
                    required: [id, cveId, resource, package, severity, source, observedAt]
                    properties:
                      id: {type: string}
                      cveId: {type: string}
                      resource: {type: string}
                      resourceName: {type: [string, 'null'], description: EC2 Name 태그(Inspector 제공)}
                      package: {type: string}
                      severity: {$ref: '#/components/schemas/Severity'}
                      source: {type: string, enum: [Inspector, Trivy]}
                      observedAt: {type: string, format: date-time, description: 가장 최근 탐지 시각(기간 필터 기준)}
                      firstObservedAt: {type: [string, 'null'], format: date-time, description: 최초 탐지 시각(선택)}
                      title: {type: [string, 'null']}
                      description: {type: [string, 'null'], description: Inspector 원문 CVE 설명(최대 1000자)}
                      remediation: {type: [string, 'null'], description: Inspector 원문 조치 안내}
                      fixAvailable: {type: [string, 'null'], enum: ['YES', 'NO', 'PARTIAL', null]}
                      exploitAvailable: {type: [string, 'null'], enum: ['YES', 'NO', null], description: 공개된 공격 코드 여부}
                      epss: {type: [number, 'null'], description: EPSS 악용 가능성 점수(0~1)}
                      packageManager: {type: [string, 'null']}
                      updateCommand: {type: [string, 'null']}
                      updateCommandSource: {type: [string, 'null'], enum: [inspector, generated, null], description: generated 는 대시보드가 플랫폼·패키지로 만든 명령(적용 전 확인)}
                      resourceType: {type: [string, 'null']}
                      platform: {type: [string, 'null']}
                      repository: {type: [string, 'null'], description: ECR 저장소 이름(이미지 취약점)}
                      imageTags: {type: array, items: {type: string}}
                      fixMethod: {type: [string, 'null'], enum: [package-update, image-rebuild, function-update, null]}
                      rebootRequired: {type: [boolean, 'null'], description: EC2 커널 패키지면 true. EC2 가 아니면 null}
                      referenceUrl: {type: [string, 'null'], format: uri, description: CVE 면 NVD, 아니면 Inspector sourceUrl(https 만)}
    InfrastructureEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              type: object
              required: [components, dependencies]
              properties:
                dependencies: {type: array, items: {type: object, required: [from, to], properties: {from: {type: string}, to: {type: string}}}}
                components:
                  type: array
                  items:
                    type: object
                    required: [id, status, observedAt, source]
                    properties:
                      id: {type: string}
                      name: {type: string}
                      resource: {type: string}
                      region: {type: string}
                      status: {type: string, enum: [healthy, degraded, unhealthy, unknown]}
                      observedAt: {type: [string, 'null'], format: date-time}
                      source: {type: string}
                      detail: {type: [string, 'null'], description: EC2 인스턴스 상태(running 등)}
                      kind: {type: string, const: server}
                      role: {type: [string, 'null'], description: EC2 Role 태그}
                tiers:
                  type: array
                  description: 3계층(Nginx·Flask·MySQL). 점검 결과를 저장하는 작업이 없으면 status=unknown, observedAt=null.
                  items:
                    type: object
                    required: [id, name, status, observedAt]
                    properties:
                      id: {type: string}
                      name: {type: string}
                      role: {type: string}
                      status: {type: string, enum: [healthy, degraded, unhealthy, unknown]}
                      observedAt: {type: [string, 'null'], format: date-time}
                      source: {type: [string, 'null']}
                      detail: {type: [string, 'null']}
                alarms:
                  type: [array, 'null']
                  description: CloudWatch 지표 알람(사용자 범위 안). 이름 접두어 설정이 없거나 읽기 실패면 null(실패는 meta.warnings).
                  items: {$ref: '#/components/schemas/Alarm'}
    HistoryEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              type: object
              required: [items, jobs, nextCursor]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
                jobs: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
                nextCursor: {type: [string, 'null']}
    ApproveRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, playbookId, parameters]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
        playbookId: {type: string, minLength: 1}
        parameters: {type: object, description: 서버가 제공한 계획의 매개변수와 정확히 일치해야 함}
    CancelRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
    ExecuteRequest:
      type: object
      additionalProperties: false
      required: [eventId, approvalId, expectedVersion]
      properties:
        eventId: {type: string, minLength: 1}
        approvalId: {type: string, minLength: 1}
        expectedVersion: {type: integer, minimum: 1}
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [eventId, actionId, expectedVersion]
      properties:
        eventId: {type: string, minLength: 1}
        actionId: {type: string, minLength: 1}
        expectedVersion: {type: integer, minimum: 1}
    ActionResponse:
      type: object
      required: [eventId, actionId, actionState, version]
      properties:
        eventId: {type: string}
        actionId: {type: string}
        actionState: {$ref: '#/components/schemas/ActionState'}
        version: {type: integer, minimum: 1}
    ApprovalEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              allOf:
                - {$ref: '#/components/schemas/ActionResponse'}
                - required: [approvalId, expiresAt]
                  properties:
                    actionState: {const: APPROVED}
                    approvalId: {type: string}
                    expiresAt: {type: string, format: date-time}
    CancelEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              allOf:
                - {$ref: '#/components/schemas/ActionResponse'}
                - properties: {actionState: {const: CANCELLED}}
    QueuedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              allOf:
                - {$ref: '#/components/schemas/ActionResponse'}
                - required: [jobId, statusUrl]
                  properties:
                    actionState: {const: QUEUED}
                    jobId: {type: string}
                    statusUrl: {type: string, pattern: '^/api/history\?jobId='}
    VerifyQueuedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - properties:
            data:
              allOf:
                - {$ref: '#/components/schemas/ActionResponse'}
                - required: [jobId, statusUrl]
                  properties:
                    actionState: {const: VERIFY_QUEUED}
                    jobId: {type: string}
                    statusUrl: {type: string, pattern: '^/api/history\?jobId='}

    HoneypotStatusEnvelope:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [deployed, verdict]
          properties:
            deployed: {type: boolean}
            verdict:
              type: object
              required: [state, label, reasons]
              properties:
                state: {type: string, enum: [ok, waiting, partial, unknown, not_deployed]}
                label: {type: string}
                reasons: {type: array, items: {type: string}}
            cards:
              type: object
              description: instance·logs·ai·alarm·block. 각 카드는 state(ok·info·warn·bad·unknown)·text·at·detail.
              additionalProperties:
                type: object
                required: [state, text]
                properties:
                  state: {type: string, enum: [ok, info, warn, bad, unknown]}
                  text: {type: string}
                  at: {type: [integer, 'null']}
                  detail: {type: string}
            canWrite: {type: boolean}
        meta: {$ref: '#/components/schemas/Meta'}
    BlocklistReleaseRequest:
      type: object
      required: [reason, expectedVersion]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        expectedVersion: {type: integer, minimum: 0, description: '목록의 version. 표에 기록이 없는 수동 차단은 0.'}
        allowlist: {type: boolean, default: false}
    BlocklistPatchRequest:
      type: object
      required: [reason, expectedVersion]
      additionalProperties: false
      description: durationHours 또는 allowlisted 중 하나 이상.
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        expectedVersion: {type: integer, minimum: 0}
        durationHours: {type: integer, enum: [0, 1, 24, 168]}
        allowlisted: {type: boolean}
