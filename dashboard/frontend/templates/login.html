<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#141616"><meta name="description" content="AWS 보안 관제 대시보드 로그인">
 <title>로그인 · AWS Security Operations</title>
 <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="/static/css/tailwind.css">
 <link rel="stylesheet" href="/static/css/app.css?v=2.2.2">
 <script type="module" src="/static/js/login.js?v=2.2.2"></script>
</head>
<body class="login-body">
<main class="login-card" id="main">
 <div class="brand flex items-center gap-3">
  <svg width="24" height="28" viewBox="0 0 24 28" fill="none" aria-hidden="true"><path d="M12 2 22 6v8c0 6-10 12-10 12S2 20 2 14V6Z" stroke="currentColor" stroke-width="1.5"/><path d="m7 13 3 3 7-7" stroke="currentColor" stroke-width="1.5"/></svg>
  <span>AWS <strong>Security Operations</strong></span>
 </div>
 <h1>관제 대시보드 로그인</h1>
 <p class="login-hint">최초 계정은 서버가 <code>instance/initial-login.txt</code> 에 기록합니다.</p>

 <form id="login-form" novalidate>
  <label for="username">아이디</label>
  <input id="username" name="username" type="text" autocomplete="username" required maxlength="64" autofocus>

  <label for="password">암호</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">

  <p id="login-error" class="login-error" role="alert" hidden></p>
  <button id="submit" type="submit">로그인</button>
 </form>
</main>
</body>
</html>
