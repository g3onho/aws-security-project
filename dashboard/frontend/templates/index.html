<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#f3f4f4"><meta name="description" content="AWS 보안 탐지, 대응, 재검증을 확인하는 관제 대시보드">
 <title>AWS Security Operations · 통합 관제</title>
 <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="/static/css/tailwind.css">
 <link rel="stylesheet" href="/static/css/app.css?v=v46">
 <link rel="stylesheet" href="/static/css/local.css?v=v46">
 <script defer src="/static/vendor/chart.umd.js"></script>
 <script defer src="/static/vendor/d3-force.min.js"></script>
 <script type="module" src="/static/js/app.js?v=v46"></script>
</head>
<body>
<a class="skip-link" href="#main">본문으로 이동</a>
<header class="topbar flex items-center justify-between">
 <a class="brand flex items-center gap-3" href="/"><svg width="24" height="28" viewBox="0 0 24 28" fill="none" aria-hidden="true"><path d="M12 2 22 6v8c0 6-10 12-10 12S2 20 2 14V6Z" stroke="currentColor" stroke-width="1.5"/><path d="m7 13 3 3 7-7" stroke="currentColor" stroke-width="1.5"/></svg><span>AWS <strong>Security Operations</strong></span></a>
 <div class="top-controls flex items-center gap-3"><div id="network-activity" class="network-activity" role="status" aria-live="polite" aria-atomic="true" aria-label="데이터 불러오는 중" aria-hidden="true" title="데이터 불러오는 중"><span class="network-spinner" aria-hidden="true"></span><span class="sr-only">데이터 불러오는 중</span></div><span class="data-dot" id="data-mode" hidden></span><span class="connection" id="aws-state" role="status" data-state="unknown">AWS 확인 중</span><div class="notification-wrap"><button id="notifications" class="icon-button" aria-label="상태 바로가기" aria-expanded="false" aria-controls="notification-panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="notification-count" class="notification-dot" aria-hidden="true" hidden></span></button><div id="notification-panel" class="notification-panel" role="region" aria-label="상태 바로가기" hidden></div></div><span id="session-user" class="session-user"></span><button id="auto-refresh" class="subtle-button" aria-pressed="false">자동 새로고침 꺼짐</button><button id="logout" class="subtle-button">로그아웃</button></div>
</header>
<aside class="sidebar">
 <div class="workspace-label">DASHBOARD HERA</div>
 <nav aria-label="주 메뉴">
  <div class="sidebar-nav-main">
   <button data-view="overview" class="active"><span>▦</span>통합 관제</button>
   <button data-view="events"><span>◎</span>보안 이벤트</button>
   <button data-view="vulnerabilities"><span>◇</span>취약점 점검</button>
   <button data-view="infrastructure"><span>▥</span>인프라 모니터링</button>
   <button data-view="responses"><span>↻</span>조치 이력</button>
  </div>
  <div class="sidebar-nav-bottom">
   <button data-view="drills"><span>⚔</span>보안 시나리오</button>
   <button data-view="honeypot"><span>◈</span>허니팟</button>
  </div>
 </nav>
</aside>
<main id="main" tabindex="-1">
 <section class="page-heading flex items-center justify-between gap-3"><div><div class="eyebrow">SECURITY OPERATIONS CENTER</div><h1 id="page-title">통합 관제 <span>Overview</span></h1></div><div class="refresh-group"><span id="updated">갱신 대기</span><button id="refresh" class="subtle-button">↻ 새로고침</button><div id="page-exports" class="page-exports" role="group" aria-label="이 화면 내보내기" hidden><button id="page-ai-report" class="subtle-button accent" type="button" title="현재 화면을 AI 가 요약합니다"><span aria-hidden="true">✦</span> AI 요약</button><button id="page-log-save" class="subtle-button" type="button" title="현재 화면의 로그를 CSV로 저장합니다(AI 미사용)"><span aria-hidden="true">↓</span> 로그 저장</button></div></div></section>
 <div id="load-state" class="load-state" role="status" hidden></div>
 <section class="filters flex items-center gap-2" aria-label="데이터 필터">
  <label class="sr-only" for="region">리전</label><select id="region"></select>
  <label class="sr-only" for="severity">위험도</label><select id="severity"><option value="">모든 위험도</option><option value="Critical">Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
  <label class="sr-only" for="status">처리 상태</label><select id="status"><option value="">모든 상태</option></select>
  <label class="sr-only" for="source">탐지 소스</label><select id="source"><option value="">모든 탐지 소스</option></select>
  <div class="search-wrap"><span aria-hidden="true">⌕</span><label class="sr-only" for="search">이벤트 검색</label><input id="search" type="search" placeholder="이벤트, 자원 ID 검색" autocomplete="off"></div>
  <button id="clear-filters" class="text-button">초기화</button>
 </section>
 <section id="map-section" class="panel map-section">
  <div class="map-heading"><h2><span class="status-dot"></span> 리전별 탐지 현황</h2><span>REGIONAL THREAT OVERVIEW</span></div>
  <div class="map-stage">
   <div class="map-canvas" id="map-canvas"><svg id="world-map" tabindex="0" aria-describedby="map-help" viewBox="0 0 1000 460" role="group" aria-label="AWS 리전별 이벤트 지도"><defs><pattern id="grid" width="62.5" height="57.5" patternUnits="userSpaceOnUse"><path d="M 62.5 0 L 0 0 0 57.5" fill="none" stroke="#e6eceb" stroke-width=".5"/></pattern><radialGradient id="glow"><stop stop-color="#0e8f80" stop-opacity=".12"/><stop offset="1" stop-color="#0e8f80" stop-opacity="0"/></radialGradient></defs><g id="map-transform"><g id="globe-base"></g><g id="countries"></g><g id="globe-shade"></g><g id="attack-paths"></g><g id="markers"></g></g></svg>
    <div class="attack-toolbar"><label class="sr-only" for="attack-filter">공격 흐름 선택</label><select id="attack-filter"><option value="all">전체 공격 흐름</option></select><span id="attack-summary" role="status"></span></div><div class="map-controls"><button id="zoom-in" aria-label="지도 확대">+</button><button id="zoom-out" aria-label="지도 축소">−</button><button id="zoom-reset" aria-label="지도 초기화">⌖</button></div>
    <div class="map-legend"><span class="map-legend-item"><span class="attack-legend-line">—</span> GuardDuty</span><span class="map-legend-item"><span class="attack-legend-line attack-legend-waf">—</span> WAF 웹 공격</span><div class="map-help" id="map-help">드래그 회전 · 휠 확대/축소 · 방향키 회전 <span id="zoom-label">1.0×</span></div></div>
    <button id="open-region" class="subtle-button open-region" hidden>지역 상세 열기 →</button>
   </div>
   <aside id="region-panel" aria-label="선택 지역 상세"></aside>
  </div>
 </section>
 <section class="timeline panel" aria-label="조회 기간">
  <div class="time-presets flex items-center gap-1"><span class="muted">기간</span><button data-hours="0.25">15분</button><button data-hours="1">1시간</button><button data-hours="24" class="active">1일</button><button data-hours="168">1주일</button></div>
  <div id="period-track" class="period-track"></div>
  <div id="time-label" class="time-label"></div>
 </section>
 <div id="worker-state" class="local-context" role="status"></div><div id="content"></div>
 <footer class="main-footer"><span><span class="status-dot"></span> DATA SOURCE <span class="footer-divider">/</span> 수집된 실제 데이터만 표시합니다.</span><span id="footer-asof">기준 데이터 —</span></footer>
</main>
<dialog id="run-dialog" aria-labelledby="run-dialog-title"><div id="run-dialog-content"></div></dialog>
<dialog id="flow-dialog" aria-labelledby="flow-dialog-title"><div id="flow-dialog-content"></div></dialog>
<dialog id="event-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<dialog id="bulk-dialog" aria-labelledby="bulk-title"><div id="bulk-content"></div></dialog>
<dialog id="remediate-dialog" aria-labelledby="remediate-title"><div id="remediate-content"></div></dialog>
<dialog id="replay-dialog" aria-labelledby="replay-title"><div id="replay-content"></div></dialog>
<dialog id="report-dialog" aria-labelledby="report-title"><div id="report-content"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
