name: terraform plan

# plan 전용입니다. apply 는 사람이 직접 실행합니다.
# 학생가이드 4.1 "plan 공유 → 팀 협의·승인 → apply" 에서
# 앞의 두 단계를 자동화하고, 마지막 apply 는 사람에게 남겨둔 형태입니다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write        # OIDC 토큰 발급에 필수
  contents: read
  pull-requests: write   # plan 결과를 PR 코멘트로

env:
  AWS_REGION: ap-northeast-2
  # CI 에서는 admin_cidr 를 반드시 지정합니다.
  # 비워두면 GitHub 러너의 IP 가 잡혀서 SG 가 매번 바뀌고 본인이 접속하지 못합니다.
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
  TF_VAR_team_name: ${{ vars.TEAM_NAME }}
  TF_VAR_owner: ${{ vars.OWNER }}

concurrency:
  # 동시에 두 개가 돌면 state 잠금에서 하나가 죽습니다. 큐로 세웁니다.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # terraform 파일이 저장소 루트가 아니라 하위 폴더에 있습니다.
    defaults:
      run:
        working-directory: aws-soar-terraform
    steps:
      - uses: actions/checkout@v4

      # OIDC sub 값 확인용. 인증이 되면 지워도 됩니다.
      - name: OIDC 신원 확인
        run: |
          echo "GITHUB_REPOSITORY = $GITHUB_REPOSITORY"
          echo "GITHUB_REF        = $GITHUB_REF"
          echo "GITHUB_EVENT_NAME = $GITHUB_EVENT_NAME"
          echo "기대하는 sub      = repo:$GITHUB_REPOSITORY:ref:$GITHUB_REF"

      - name: admin_cidr 확인
        run: |
          if [ -z "$TF_VAR_admin_cidr" ]; then
            echo "::error::리포지토리 변수 ADMIN_CIDR 가 비어 있습니다."
            echo "Settings > Secrets and variables > Actions > Variables 에서 설정해 주세요."
            echo "비워두면 GitHub 러너 IP 가 admin_cidr 로 들어갑니다."
            exit 1
          fi
          if [ "$TF_VAR_admin_cidr" = "0.0.0.0/0" ]; then
            echo "::error::ADMIN_CIDR 가 0.0.0.0/0 입니다. 학생가이드 6.2 금지 항목입니다."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # 역할 ARN 은 비밀값이 아닙니다. 신뢰 정책이 이 저장소로 제한하고 있습니다.
          role-to-assume: arn:aws:iam::455958489281:role/github-actions-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: init
        run: terraform init -input=false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: plan 결과를 PR 에 코멘트
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('aws-soar-terraform/plan.txt', 'utf8');
            // 코멘트 길이 제한(65536)에 걸리지 않게 자릅니다.
            const max = 60000;
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n\n... (출력이 길어 잘렸습니다. Actions 로그를 봐 주세요)';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### terraform plan',
                '',
                '<details><summary>펼치기</summary>',
                '',
                '```hcl',
                plan,
                '```',
                '',
                '</details>',
                '',
                '> `+ create` / `~ update` / `-/+ replace` / `- destroy` 를 확인해 주세요.',
                '> `-/+` 는 삭제 후 재생성입니다. DB 라면 데이터가 사라집니다.',
                '> 승인 후 apply 는 담당자가 로컬에서 직접 실행합니다.'
              ].join('\n')
            });

      # 증적으로 남깁니다. 학생가이드 9.2의 10번 항목(Plan 결과)에 씁니다.
      - name: plan 보관
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            aws-soar-terraform/tfplan
            aws-soar-terraform/plan.txt
          retention-days: 14
