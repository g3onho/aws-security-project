schemaVersion: '2.2'
description: |
  Docker Host 의 3계층(Nginx -> Flask -> MySQL) 컨테이너 상태를 읽기 전용으로 점검하고
  한 줄씩 "TIER|<web|app|db>|<healthy|degraded|unhealthy|unknown>|<설명>" 으로 출력합니다.
  tier_check Lambda 가 실행하고 결과를 DynamoDB 에 저장합니다. 이 문서는 아무것도 바꾸지 않습니다.
  (docker inspect 의 Go 템플릿 중괄호가 SSM 매개변수 문법과 겹치지 않도록 JSON 출력을 python3 로 읽습니다.)
parameters:
  ComposeFile:
    type: String
    default: /opt/app/compose.yaml
    description: 서비스 compose 파일 경로
mainSteps:
  - action: 'aws:runShellScript'
    name: checkTiers
    inputs:
      runCommand:
        - '#!/bin/bash'
        - set -uo pipefail
        - COMPOSE="{{ ComposeFile }}"
        - |
          emit() { printf 'TIER|%s|%s|%s\n' "$1" "$2" "$3"; }
          if ! command -v docker >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
            for t in web app db; do emit "$t" unknown "docker 또는 python3 를 사용할 수 없어 점검하지 못했습니다"; done
            exit 0
          fi
          cid() { docker compose -f "$COMPOSE" ps -q "$1" 2>/dev/null | head -n1; }
          jget() { docker inspect "$1" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin)[0]; print($2)" 2>/dev/null; }
          cstate() { jget "$1" 'd["State"]["Status"]'; }
          chealth() { jget "$1" 'd["State"].get("Health",{}).get("Status","none")'; }
          cips() { jget "$1" '" ".join(n.get("IPAddress","") for n in d["NetworkSettings"]["Networks"].values())'; }
        - |
          # --- 웹(Nginx): 컨테이너 실행 + 호스트 80 포트의 /health 응답(2xx~3xx) ---
          id=$(cid nginx)
          if [ -z "$id" ]; then emit web unhealthy "nginx 컨테이너가 없습니다"
          else
            st=$(cstate "$id")
            if [ "$st" != "running" ]; then emit web unhealthy "nginx 컨테이너 상태: ${st:-확인 불가}"
            else
              code=$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1/health || true)
              case "$code" in
                2??|3??) emit web healthy "컨테이너 실행 중, /health 응답 $code" ;;
                *) emit web degraded "컨테이너는 실행 중이나 /health 응답이 정상이 아닙니다($code)" ;;
              esac
            fi
          fi
        - |
          # --- 애플리케이션(Flask): 컨테이너 실행 + 컨테이너 IP:5000 직접 응답(Nginx 를 거치지 않음) ---
          id=$(cid web)
          if [ -z "$id" ]; then emit app unhealthy "web(Flask) 컨테이너가 없습니다"
          else
            st=$(cstate "$id")
            if [ "$st" != "running" ]; then emit app unhealthy "web(Flask) 컨테이너 상태: ${st:-확인 불가}"
            else
              best=000
              for ip in $(cips "$id"); do
                code=$(curl -s -o /dev/null -m 3 -w '%{http_code}' "http://$ip:5000/" || true)
                if [ "$code" != "000" ]; then best=$code; break; fi
              done
              case "$best" in
                000) emit app degraded "컨테이너는 실행 중이나 5000 포트가 응답하지 않습니다" ;;
                5??) emit app degraded "컨테이너 실행 중, 응답 오류($best)" ;;
                *) emit app healthy "컨테이너 실행 중, 5000 포트 응답 $best" ;;
              esac
            fi
          fi
        - |
          # --- 데이터베이스(MySQL): 컨테이너 실행 + compose healthcheck(mysqladmin ping) 결과 ---
          id=$(cid db)
          if [ -z "$id" ]; then emit db unhealthy "db(MySQL) 컨테이너가 없습니다"
          else
            st=$(cstate "$id")
            if [ "$st" != "running" ]; then emit db unhealthy "db(MySQL) 컨테이너 상태: ${st:-확인 불가}"
            else
              case "$(chealth "$id")" in
                healthy) emit db healthy "컨테이너 실행 중, healthcheck 통과" ;;
                starting) emit db degraded "컨테이너 기동 중(healthcheck 대기)" ;;
                unhealthy) emit db unhealthy "healthcheck 실패" ;;
                *) emit db degraded "컨테이너는 실행 중이나 healthcheck 결과가 없습니다" ;;
              esac
            fi
          fi
