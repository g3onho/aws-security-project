schemaVersion: '0.3'
description: |
  IAM 계정 비밀번호 정책을 Security Hub IAM.7 기본 기준에 맞춥니다.
  기준(IAM.7 기본 매개변수): 대문자·소문자·숫자·기호 필수, 최소 8자.
  비밀번호 만료(MaxPasswordAge)·재사용 금지는 새로 켜지 않습니다 → 기존 비밀번호가 바로 만료되지 않습니다.
  기존 정책에 이미 있는 값(더 긴 최소 길이, 만료, 재사용 금지, 사용자 변경 허용)은 그대로 둡니다.
  Terraform 은 이 계정 설정을 관리하지 않으므로(aws_iam_account_password_policy 0건) 다음 apply 가 되돌리지 않습니다.
  되돌리기: before 출력 값으로 aws iam update-account-password-policy 재실행
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  AutomationAssumeRole:
    type: String
    description: 이 문서를 실행할 역할 ARN
mainSteps:
  - name: setPasswordPolicy
    action: 'aws:executeScript'
    outputs:
      - Name: before
        Selector: $.Payload.before
        Type: String
      - Name: after
        Selector: $.Payload.after
        Type: String
      - Name: changed
        Selector: $.Payload.changed
        Type: Boolean
    inputs:
      Runtime: python3.11
      Handler: handler
      Script: |
        import boto3, json
        from botocore.exceptions import ClientError
        MIN_LENGTH = 8  # Security Hub IAM.7 기본 매개변수
        REQUIRED = ("RequireSymbols", "RequireNumbers", "RequireUppercaseCharacters", "RequireLowercaseCharacters")
        KEEP = ("MaxPasswordAge", "PasswordReusePrevention", "HardExpiry")
        def _current(iam):
            try:
                return iam.get_account_password_policy()["PasswordPolicy"]
            except ClientError as error:
                if error.response.get("Error", {}).get("Code") == "NoSuchEntity":
                    return {}
                raise
        def handler(event, context):
            iam = boto3.client("iam")
            before = _current(iam)
            ok = before.get("MinimumPasswordLength", 0) >= MIN_LENGTH and all(before.get(k) for k in REQUIRED)
            if not ok:
                want = {"MinimumPasswordLength": max(MIN_LENGTH, before.get("MinimumPasswordLength", 0)),
                        # 생략하면 false 로 바뀌어 사용자가 자기 비밀번호를 못 바꾼다 — 기존 값 유지, 없으면 허용
                        "AllowUsersToChangePassword": before.get("AllowUsersToChangePassword", True),
                        **{k: True for k in REQUIRED},
                        **{k: before[k] for k in KEEP if k in before}}
                iam.update_account_password_policy(**want)
            after = _current(iam)
            return {"before": json.dumps(before, default=str), "after": json.dumps(after, default=str),
                    "changed": before != after}
