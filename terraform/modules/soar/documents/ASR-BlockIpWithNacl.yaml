schemaVersion: '0.3'
description: |
  공격 출발지 IP 를 Private NACL 의 Deny 규칙(번호 1~99)으로 차단합니다 (SEC-06).
  오탐 가능성 때문에 자동화하지 않고, 담당자가 대시보드에서 승인한 뒤 실행합니다.
  before/after 규칙을 반환해 Before-After 비교에 사용합니다.

  소유권 경계 (docs/OWNERSHIP.md):
    1 ~ 99  : 이 문서(SOAR) 전용. Terraform 코드에 선언하지 않으므로 apply 로 지워지지 않습니다.
    100 이상: Terraform 소유(aws_network_acl_rule). 이 문서가 쓰면 다음 apply 와 충돌합니다.
  IAM 에는 규칙 번호를 제한하는 조건 키가 없어서 이 문서가 직접 막습니다.
    - RuleNumber 1~99 만 허용
    - AttackerCidr 는 IPv4 /32 만 허용 (0.0.0.0/0 같은 대역 차단 금지)
    - 1~99 구간 Deny 가 이미 10개 이상이면 실패 (NACL 규칙 할당량 보호)
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  NetworkAclId:
    type: String
    description: 규칙을 추가할 NACL ID (private NACL)
    allowedPattern: '^acl-[0-9a-f]{8,17}$'
  AttackerCidr:
    type: String
    description: "차단할 출발지 IPv4 /32 (예: 10.0.2.55/32)"
    allowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32$'
  RuleNumber:
    type: Integer
    default: 10
    description: Deny 규칙 번호 (1~99 만 허용, Allow 100 보다 앞)
  AutomationAssumeRole:
    type: String
mainSteps:
  - name: addDenyRule
    action: 'aws:executeScript'
    outputs:
      - Name: before
        Selector: $.Payload.before
        Type: String
      - Name: after
        Selector: $.Payload.after
        Type: String
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        nacl_id: '{{ NetworkAclId }}'
        cidr: '{{ AttackerCidr }}'
        rule_number: '{{ RuleNumber }}'
      Script: |
        import boto3, ipaddress, json
        # SOAR 전용 번호대. 100 이상은 Terraform 소유라 여기서 쓰면 apply 와 충돌한다.
        DENY_MIN, DENY_MAX = 1, 99
        # 1~99 구간 Deny 동시 상한. NACL 규칙 할당량(방향별 기본 20개)은 허용 규칙과 공유한다.
        MAX_DENY_RULES = 10
        def _entries(ec2, nacl_id):
            acl = ec2.describe_network_acls(NetworkAclIds=[nacl_id])["NetworkAcls"][0]
            return [e for e in acl["Entries"] if not e["Egress"]]
        def handler(event, context):
            nacl_id = event["nacl_id"]
            rule_number = int(event["rule_number"])
            if not DENY_MIN <= rule_number <= DENY_MAX:
                raise ValueError(f"RuleNumber {rule_number} 거부: SOAR 는 {DENY_MIN}~{DENY_MAX} 만 사용 (100 이상은 Terraform 소유)")
            # allowedPattern 과 같은 조건을 한 번 더 확인한다 (문서 수정 시 패턴이 빠져도 막히도록)
            net = ipaddress.ip_network(event["cidr"], strict=True)
            if net.version != 4 or net.prefixlen != 32 or net.network_address.is_unspecified:
                raise ValueError(f"AttackerCidr {event['cidr']} 거부: IPv4 /32 단일 주소만 허용")
            ec2 = boto3.client("ec2")
            entries = _entries(ec2, nacl_id)
            soar_denies = [e for e in entries
                           if e["RuleAction"] == "deny" and DENY_MIN <= e["RuleNumber"] <= DENY_MAX]
            if len(soar_denies) >= MAX_DENY_RULES:
                raise ValueError(f"{nacl_id} 의 {DENY_MIN}~{DENY_MAX} Deny 가 {len(soar_denies)}개로 상한 {MAX_DENY_RULES}개 도달. 만료 규칙을 먼저 해제")
            before = json.dumps(entries, default=str)
            ec2.create_network_acl_entry(
                NetworkAclId=nacl_id, RuleNumber=rule_number,
                Protocol="-1", RuleAction="deny", Egress=False,
                CidrBlock=str(net))
            after = json.dumps(_entries(ec2, nacl_id), default=str)
            return {"before": before, "after": after}
