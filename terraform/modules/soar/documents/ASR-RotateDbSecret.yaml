schemaVersion: '0.3'
description: |
  MySQL 앱 계정 비밀번호를 새로 발급해 Secrets Manager 에 반영합니다 (SEC-07).
  실제 DB 반영은 대상 인스턴스에서 Run Command 로 이어서 수행합니다.
  민감정보라 값 자체는 기록하지 않고 성공 여부만 남깁니다.
assumeRole: '{{ AutomationAssumeRole }}'
parameters:
  SecretId:
    type: String
    description: 로테이션할 Secrets Manager 시크릿 이름/ARN
  AutomationAssumeRole:
    type: String
mainSteps:
  - name: rotateAppPassword
    action: 'aws:executeScript'
    outputs:
      - Name: before
        Selector: $.Payload.before
        Type: String
      - Name: after
        Selector: $.Payload.after
        Type: String
    inputs:
      Runtime: python3.11
      Handler: handler
      InputPayload:
        secret_id: '{{ SecretId }}'
      Script: |
        import boto3, json, secrets, string
        def handler(event, context):
            sm = boto3.client("secretsmanager")
            sid = event["secret_id"]
            cur = json.loads(sm.get_secret_value(SecretId=sid)["SecretString"])
            alphabet = string.ascii_letters + string.digits + "!#$%*_-+="
            new_pw = "".join(secrets.choice(alphabet) for _ in range(24))
            cur["app_password"] = new_pw
            sm.put_secret_value(SecretId=sid, SecretString=json.dumps(cur))
            # 값은 남기지 않고 상태만 기록
            return {"before": "app_password rotated", "after": "stored in Secrets Manager; apply on DB via Run Command"}
