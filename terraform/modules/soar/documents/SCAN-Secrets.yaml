schemaVersion: '2.2'
description: |
  서비스 코드/설정에 하드코딩된 비밀값·자격증명을 Trivy 로 점검한다(SEC-07).
  결과(HIGH/CRITICAL 및 secret finding)를 S3(스캔 결과 버킷)에 업로드한다.
  격리된 팀 소유 실습 대상에만 사용한다. 대시보드 "전부 실행"이 호출한다.
parameters:
  ServiceDir:
    type: String
    description: 점검할 서비스 코드 디렉터리
    default: /opt/app
  ScanBucket:
    type: String
    description: 결과를 올릴 S3 버킷
  RegionLabel:
    type: String
    description: 표기용 라벨
    default: seoul
mainSteps:
  - action: 'aws:runShellScript'
    name: secretScan
    inputs:
      runCommand:
        - '#!/bin/bash'
        - set -uo pipefail
        - |
          if ! command -v trivy >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y wget apt-transport-https gnupg
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
            sudo apt-get update -y && sudo apt-get install -y trivy
          fi
        - TS=$(date +%Y%m%dT%H%M%SZ)
        - OUT="/tmp/secret-scan-$TS.txt"
        - 'echo "== secret scan {{ ServiceDir }} @ $TS ==" | tee "$OUT"'
        - '# 코드/설정의 하드코딩 비밀값(access key, 토큰, 커넥션 문자열)을 탐지한다.'
        - 'trivy fs --scanners secret --no-progress "{{ ServiceDir }}" 2>&1 | tee -a "$OUT" || true'
        - 'aws s3 cp "$OUT" "s3://{{ ScanBucket }}/secrets/$TS.txt"'
        - 'echo "uploaded to s3://{{ ScanBucket }}/secrets/$TS.txt"'
